<!DOCTYPE html>
<!-- LUMI_GRID_VERSION: today-only-after-start-new-day -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumi Nails • Luxury Grid</title>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./lumi_shared_config.js"></script>
  <script>
    // Bridge for older inline scripts that reference supabaseClient directly.
    if (!window.supabaseClient) {
      throw new Error('Lumi setup error: supabaseClient was not created. Check that supabase-js loads before lumi_shared_config.js.');
    }
    const supabaseClient = window.supabaseClient;
  </script>
  <style>
    :root{
      --bg:#f7f4ef;
      --bg2:#fbf9f5;
      --panel:rgba(255,255,255,.94);
      --line:#ded5c8;
      --line2:#e8dfd2;
      --text:#3c342d;
      --muted:#7c746a;
      --gold:#c8a66b;
      --gold-deep:#a78342;
      --cyan:#d7eef3;
      --pink:#fff3f4;
      --pink-text:#c75c75;
      --dark1:#111a20;
      --dark2:#04080b;
      --green:#557260;
      --green-soft:#edf6ef;
      --red:#a95858;
      --red-soft:#fff3f2;
      --blue:#6f7f9a;
      --blue-soft:#f3f5fa;
      --shadow:0 22px 70px rgba(88,67,45,.11);
      --soft-shadow:0 10px 28px rgba(88,67,45,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:
        radial-gradient(circle at top left,rgba(200,166,107,.16),transparent 25%),
        radial-gradient(circle at bottom right,rgba(220,210,198,.28),transparent 30%),
        linear-gradient(180deg,var(--bg2),var(--bg));
      color:var(--text);
      min-height:100vh;
    }
    .wrap{padding:18px;max-width:1920px;margin:0 auto}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      flex-wrap:wrap;margin-bottom:14px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:18px 20px;
      backdrop-filter:blur(10px);
    }
    .eyebrow{
      display:inline-flex;align-items:center;gap:10px;
      color:var(--gold-deep);
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:12px;
      font-weight:900;
      margin-bottom:5px;
    }
    .eyebrow:before{
      content:"";
      width:34px;height:1px;
      background:linear-gradient(90deg,var(--gold),transparent);
      display:block;
    }
    .title{
      font-size:38px;
      line-height:1.02;
      font-weight:900;
      font-family:Georgia,serif;
      letter-spacing:-.025em;
      color:var(--text);
    }
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:12px 14px;
      font:inherit;
      color:var(--text);
      cursor:pointer;
      font-weight:800;
      transition:.15s ease;
    }
    button:hover{transform:translateY(-1px)}
    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      font-size:12px;
      font-weight:900;
      color:var(--text);
      box-shadow:0 4px 14px rgba(88,67,45,.04);
      display:inline-flex;
      align-items:center;
      gap:7px;
    }
    .pill.success{background:rgba(85,114,96,.12); color:var(--green); border-color:rgba(85,114,96,.18)}
    .muted-note{color:var(--muted);font-size:14px;line-height:1.6;margin-top:4px}

    .hero-next{
      margin-bottom:14px;
      border:1px solid rgba(200,166,107,.36);
      border-radius:26px;
      box-shadow:var(--shadow);
      background:
        radial-gradient(circle at top left,rgba(200,166,107,.18),transparent 28%),
        linear-gradient(135deg,#fffaf0,#fff);
      padding:22px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    .hero-kicker{
      font-size:13px;
      letter-spacing:.17em;
      text-transform:uppercase;
      color:var(--gold-deep);
      font-weight:900;
      margin-bottom:6px;
    }
    .hero-title{
      font-size:42px;
      font-family:Georgia,serif;
      line-height:1.02;
      font-weight:900;
      letter-spacing:-.03em;
    }
    .hero-sub{font-size:16px;color:var(--muted);font-weight:800;margin-top:6px}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .hero-stats .pill{font-size:13px}

    .legend-wrap{
      margin-bottom:14px;
      display:none;
    }
    .legend-wrap.show{display:block}
    .legend{
      display:flex;gap:10px;flex-wrap:wrap;
      font-size:13px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:22px;
      box-shadow:0 12px 36px rgba(88,67,45,.08);
      padding:12px 14px;
      backdrop-filter:blur(10px);
    }
    .legend .pill{
      display:inline-flex;align-items:center;gap:8px;
      font-size:13px;
    }
    .legend .pill::before{
      content:"";
      width:16px;height:16px;border-radius:5px;
      display:inline-block;
      border:1px solid rgba(0,0,0,.08);
      flex:0 0 auto;
    }
    .legend .pill.req::before{
      background:linear-gradient(135deg,#fff 0 48%,#111a20 49% 100%);
      box-shadow:inset -4px -4px 0 rgba(200,166,107,.9);
    }
    .legend .pill.walk::before{background:#111a20}
    .legend .pill.serv::before{background:#fff;box-shadow:inset 0 0 0 3px rgba(169,88,88,.75)}
    .legend .pill.combo::before{background:repeating-linear-gradient(45deg,rgba(85,114,96,.78),rgba(85,114,96,.78) 4px,#111a20 4px,#111a20 8px)}
    .legend .pill.next::before{background:rgba(255,247,231,.95);box-shadow:inset 0 0 0 3px rgba(200,166,107,.75)}

    .board{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:24px;
      overflow:auto;
      padding:12px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .empty-state{
      background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;
      color:var(--muted);line-height:1.7
    }
    table{border-collapse:separate;border-spacing:6px;width:max-content;min-width:100%}
    th,td{border:1px solid var(--line);background:#fff;vertical-align:top;border-radius:14px}
    th{
      background:#eee7dc;padding:12px 9px;font-size:12px;text-transform:uppercase;
      letter-spacing:.12em;color:#6b6258;text-align:center;position:sticky;top:0;z-index:2;
      font-weight:900;
    }
    .col-index{width:44px;min-width:44px;text-align:center;font-weight:900}
    .col-name{width:190px;min-width:190px}
    .col-turn{width:78px;min-width:78px;text-align:center}
    .col-time{width:96px;min-width:96px;text-align:center}
    .slot-col{width:94px;min-width:94px}
    .staff-cell{
      padding:12px 10px;
      height:96px;
      background:#fff;
      box-shadow:var(--soft-shadow);
    }
    .staff-name{font-size:20px;font-weight:900;margin-bottom:8px;line-height:1.1}
    .staff-sub{
      display:flex;align-items:center;gap:8px;color:var(--muted);
      font-size:13px;flex-wrap:wrap
    }
    .turn-box{
      background:rgba(200,166,107,.14);
      color:var(--gold-deep);
      display:inline-block;
      padding:5px 8px;
      border-radius:999px;
      font-weight:900;
    }
    .time-chip{
      background:#e7f3f6;
      padding:5px 8px;
      border-radius:999px;
      display:inline-block;
      font-weight:900;
      color:#647985;
    }
    .time-chip.ready{background:rgba(85,114,96,.12); color:var(--green)}
    .time-chip.busy{background:rgba(111,127,154,.12); color:var(--blue)}
    .slot{height:96px;padding:6px;background:#fff}
    .ticket{
      height:100%;
      padding:7px 7px 6px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border-radius:12px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .ticket.dark{
      background:linear-gradient(135deg,var(--dark1),var(--dark2));
      color:#fff
    }
    .ticket.split{
      background:linear-gradient(135deg,#ffffff 0 46%,#0b1821 47% 100%);
      color:#fff
    }
    .ticket.split .ghost{color:#0b1821}
    .ticket.red{
      background:linear-gradient(135deg,#111a20 0 72%, var(--red) 73% 100%);
      color:#fff
    }
    .ticket.green{
      background:linear-gradient(135deg,#12271f,var(--green));
      color:#eafff1
    }
    .ticket.serving{
      outline:2px solid rgba(169,88,88,.95);
      outline-offset:-2px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 0 0 3px rgba(169,88,88,.10),
        0 8px 16px rgba(169,88,88,.14);
    }
    .ticket.serving::before{
      content:"Live";
      position:absolute;
      right:5px;
      bottom:5px;
      z-index:3;
      color:#ffd2d2;
      font-size:10px;
      font-weight:900;
    }

    /* Completed ticket stays visible in grid slots, but uses original history colors.
       Serving/current work is red and appears as the right-most occupied slot. */
    .ticket.dark.completed{
      background:linear-gradient(135deg,#111a20,#04080b) !important;
      color:#fff !important;
      opacity:.92;
      outline:1px solid rgba(255,255,255,.18);
      outline-offset:-2px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 8px 18px rgba(17,26,32,.18) !important;
    }
    .ticket.split.completed{
      background:linear-gradient(135deg,#ffffff 0 46%,#0b1821 47% 100%) !important;
      color:#fff !important;
      opacity:.94;
      outline:1px solid rgba(17,26,32,.18);
      outline-offset:-2px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.12),
        0 8px 18px rgba(17,26,32,.14) !important;
    }
    .ticket.dark.completed .ghost,
    .ticket.dark.completed .main,
    .ticket.dark.completed .bottom,
    .ticket.dark.completed .tiny{color:#fff !important;}
    .ticket.split.completed .ghost{color:#0b1821 !important;}
    .ticket.split.completed .main{color:#fff !important;}
    .ticket.split.completed .bottom{color:#fff !important;}
    .ticket.split.completed .tiny{color:#fff !important;}
    .ticket.completed::before{
      content:"Done";
      position:absolute;
      right:6px;
      bottom:6px;
      z-index:3;
      color:#fff;
      font-size:10px;
      font-weight:900;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      padding:2px 5px;
    }
    .ticket.split.completed::before{
      background:rgba(11,24,33,.72);
      border-color:rgba(255,255,255,.20);
    }
    .ticket.completed .tiny{padding-right:34px;}

    .main{
      font-family:Georgia,serif;
      font-size:17px;
      line-height:1.05;
      font-weight:900;
      text-align:center;
      white-space:pre-line
    }
    .ghost{
      color:#e7d6ff;font-size:12px;font-weight:900;text-align:left
    }
    .bottom{
      display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;font-weight:900
    }
    .tiny{color:#f1d9a8;font-size:11px;font-weight:900}
    .accent-green{color:#45de4a}
    .accent-red{color:#ff4c4c}
    .accent-purple{color:#f0a4ff}
    .empty{
      height:100%;
      border:1px dashed #ded2c4;
      background:
        repeating-linear-gradient(45deg,rgba(0,0,0,.018),rgba(0,0,0,.018) 6px,transparent 6px,transparent 12px),
        rgba(255,255,255,.62);
      border-radius:12px;
      position:relative;
    }
    .empty::after{
      content:"+";
      position:absolute;
      right:8px;
      bottom:5px;
      color:#d6ccc0;
      font-weight:900;
      font-size:16px;
    }
    .ghost-name{color:#a4998c;font-size:12px;padding:7px;font-weight:700}

    .section-card{
      margin-top:18px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:24px;
      padding:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .section-title{
      font-size:30px;
      font-weight:900;
      font-family:Georgia,serif;
      letter-spacing:-.02em;
      margin-bottom:6px;
    }
    .section-sub{
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      margin-bottom:12px
    }
    .wait-table-wrap{overflow:auto}
    .wait-table{
      width:100%;
      min-width:860px;
      border-collapse:collapse;
      border-spacing:0
    }
    .wait-table th,.wait-table td{
      border:1px solid #e1dbd0;
      padding:13px 14px;
      background:#fff;
      vertical-align:top;
      text-align:left;
      border-radius:0;
    }
    .wait-table th{
      background:#f1ece3;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#6b6258;
      font-weight:900;
    }
    .wait-table tbody tr:nth-child(even) td{
      background:rgba(0,0,0,.012);
    }
    .wait-table tbody tr:hover td{
      background:rgba(200,166,107,.08);
    }
    .queue-index{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:30px;height:30px;border-radius:999px;background:rgba(200,166,107,.14);
      color:var(--gold-deep);font-weight:900
    }
    .req-pill,.walk-pill{
      display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900
    }
    .req-pill{background:var(--blue-soft);color:#586887}
    .walk-pill{background:var(--green-soft);color:var(--green)}
    .turn-pill{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:46px;border-radius:999px;padding:6px 10px;background:rgba(155,126,75,.12);color:#8d6f3f;font-weight:900
    }
    .status-box{
      margin-bottom:14px;
      padding:12px 14px;
      border-radius:16px;
      background:#f8fff8;
      border:1px solid #cae5ca;
      color:#476a47;
      font-weight:900;
      box-shadow:0 8px 22px rgba(85,114,96,.06);
    }
    .error-box{
      margin-top:16px;padding:16px;border-radius:16px;background:#fff6f6;border:1px solid #e7c3c3;color:#8a4545;white-space:pre-wrap
    }
    .next-customer-row td{
      background:linear-gradient(180deg, rgba(200,166,107,.14), #fff) !important;
      box-shadow:inset 4px 0 0 var(--gold);
    }
    .requested-row td{
      background:rgba(111,127,154,.045) !important;
    }
    .highlight-tech .staff-cell{
      animation:nextPulse 1.7s ease-in-out infinite;
      background:linear-gradient(135deg, rgba(255,247,231,.92), #fff);
    }
    @keyframes nextPulse{
      0%,100%{box-shadow:0 0 0 2px rgba(200,166,107,.20),0 14px 32px rgba(200,166,107,.12)}
      50%{box-shadow:0 0 0 4px rgba(200,166,107,.34),0 14px 32px rgba(200,166,107,.18)}
    }
    .next-badge{
      display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;
      background:rgba(200,166,107,.16);color:var(--gold-deep);font-weight:900;font-size:12px
    }
    .mini-note{
      color:var(--muted);font-size:12px;line-height:1.5
    }
    .busy-text{color:var(--red);font-weight:900}
    .ready-text{color:var(--green);font-weight:900}


    /* Ultimate Mode polish */
    .hero-title{
      animation:heroBreath 2.6s ease-in-out infinite;
    }
    @keyframes heroBreath{
      0%,100%{opacity:1; transform:translateY(0)}
      50%{opacity:.88; transform:translateY(-1px)}
    }
    .hero-empty .hero-title{
      animation:none;
      font-size:34px;
    }
    .hero-empty{
      background:
        radial-gradient(circle at top left,rgba(85,114,96,.10),transparent 30%),
        linear-gradient(135deg,#fff,#fbf9f5);
      border-color:rgba(85,114,96,.18);
    }
    .ticket.serving{
      animation:liveGlow 2s ease-in-out infinite;
    }
    @keyframes liveGlow{
      0%,100%{filter:brightness(1); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 3px rgba(169,88,88,.10),0 8px 16px rgba(169,88,88,.14)}
      50%{filter:brightness(1.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 4px rgba(169,88,88,.18),0 10px 22px rgba(169,88,88,.22)}
    }
    .next-customer-row td{
      position:relative;
    }
    .next-customer-row td:first-child::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:4px;
      background:var(--gold);
    }
    .highlight-tech .staff-cell{
      border-color:rgba(200,166,107,.55);
    }
    .status-box{
      transition:all .25s ease;
    }
    .toast{
      position:fixed;
      right:24px;
      bottom:24px;
      z-index:9999;
      padding:14px 16px;
      border-radius:18px;
      border:1px solid rgba(200,166,107,.32);
      background:rgba(255,255,255,.96);
      box-shadow:0 18px 48px rgba(88,67,45,.16);
      color:var(--text);
      font-weight:900;
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
      transition:.28s ease;
    }
    .toast.show{
      opacity:1;
      transform:translateY(0);
    }
    .topbar{
      position:sticky;
      top:10px;
      z-index:10;
    }
    body.night{
      --bg:#1f1b17;
      --bg2:#28231d;
      --panel:rgba(41,35,29,.92);
      --text:#f7f1e8;
      --muted:#c9bba8;
      --line:#4a4035;
      --line2:#584c3f;
    }
    body.night th{background:#3a3128;color:#d8c8b5}
    body.night td, body.night .staff-cell, body.night .slot, body.night .section-card, body.night .board, body.night .topbar{background:rgba(42,36,30,.92)}
    body.night .empty{background:rgba(255,255,255,.04)}
    body.night .hero-next{background:linear-gradient(135deg,#3a3128,#2a241e)}
    body.night .status-box{background:rgba(85,114,96,.16)}
    @media (min-width:1400px){
      .hero-title{font-size:46px}
      .wrap{padding:22px}
    }

    @media (max-width:900px){
      .title{font-size:28px}
      .hero-title{font-size:30px}
      .staff-name{font-size:16px}
      .slot,.staff-cell{height:82px}
      .main{font-size:14px}
      .wrap{padding:12px}
    }


    #modeToggleBtn{
      min-width:110px;
    }
    body.night #modeToggleBtn{
      background:rgba(255,255,255,.92) !important;
      color:#3c342d !important;
      border-color:rgba(255,255,255,.65) !important;
    }

    /* Night mode contrast fix */
    body.night button,
    body.night .pill,
    body.night .legend .pill,
    body.night .hero-stats .pill {
      background: rgba(255,255,255,.92) !important;
      color: #3c342d !important;
      border-color: rgba(255,255,255,.65) !important;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }

    body.night .pill.success,
    body.night .hero-stats .pill.success {
      background: rgba(85,114,96,.28) !important;
      color: #dff1e3 !important;
      border-color: rgba(125,165,137,.38) !important;
    }

    body.night .legend {
      background: rgba(41,35,29,.92) !important;
      border-color: rgba(255,255,255,.28) !important;
    }

    body.night .hero-next {
      border-color: rgba(200,166,107,.42) !important;
    }

    body.night .topbar,
    body.night .hero-next,
    body.night .board,
    body.night .section-card {
      border-color: rgba(255,255,255,.18) !important;
    }

    body.night .status-box {
      color: #dff1e3 !important;
      border-color: rgba(125,165,137,.35) !important;
    }

    body.night .time-chip {
      background: rgba(255,255,255,.12) !important;
      color: #f7f1e8 !important;
    }

    body.night .time-chip.ready {
      background: rgba(85,114,96,.28) !important;
      color: #dff1e3 !important;
    }

    body.night .time-chip.busy {
      background: rgba(111,127,154,.30) !important;
      color: #e4ebff !important;
    }


    /* Lumi Color System v2 — clear, luxury, fast to scan */
    :root{
      --state-ready-bg:rgba(85,114,96,.16);
      --state-ready-text:#46634f;
      --state-ready-border:rgba(85,114,96,.28);

      --state-busy-bg:rgba(111,127,154,.16);
      --state-busy-text:#526179;
      --state-busy-border:rgba(111,127,154,.26);

      --state-serving-1:#6f1f1f;
      --state-serving-2:#b23a3a;
      --state-serving-glow:rgba(178,58,58,.32);

      --state-next-bg:rgba(200,166,107,.18);
      --state-next-text:#8a6c36;

      radial-gradient(circle at 86% 88%, rgba(74,188,106,.07), transparent 42%) !important;
  }
  body.night tr.tech-next-priority .staff-cell::after{
    box-shadow:inset 0 0 13px rgba(200,166,107,.12) !important;
  }
  body.night tr.tech-next-priority .staff-name::after{
    background:rgba(200,166,107,.16) !important;
    color:#f0d79c !important;
    border-color:rgba(200,166,107,.36) !important;
  }
</style>

</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="eyebrow">Lumi Nails • Luxury Grid</div>
        <div class="title">Lumi Nails • Luxury Grid</div>
        <div class="muted-note">Luxury display mode for Lumi Nails.</div>
      </div>
      <div class="controls">
        <span class="pill success">Live Sync</span>
        <button id="modeToggleBtn" type="button">Light Mode</button>
        <span class="pill" id="lastUpdated">--:--:--</span>
        <button id="nextHeroToggleBtn" class="next-hero-toggle on" type="button">Tiếp Theo: ON</button>
        <button id="legendBtn" type="button">Legend</button>
        <button id="refreshBtn" type="button">Refresh</button>
        <button onclick="window.print()" type="button">Print</button>
      </div>
    </div>

    <div id="heroNext"></div>

    <div id="legendWrap" class="legend-wrap">
      <div class="legend">
        <div class="pill walk">Walk-in = khách mới không hẹn</div>
        <div class="pill req">Requested = yêu cầu thợ cụ thể</div>
        <div class="pill next">Appt = khách có lịch hẹn</div>
        <div class="pill combo">VIP / Owner Guest / Fix / Redo = priority tag</div>
        <span class="service-dot pedi">Pedi</span>
        <span class="service-dot gelx">Gel-X</span>
        <span class="service-dot dip">Dip</span>
        <span class="service-dot hybrid">Hybrid</span>
        <span class="service-dot mani">Mani</span>
        <div class="pill serv">Serving = đang phục vụ</div>
      </div>
    </div>

    <div id="statusArea"></div>
    <div id="content"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const NEXT_HERO_VISIBLE_KEY = "lumi-grid-show-next-hero";
    const ENABLE_VOICE_CALL = false;
    let showNextHero = localStorage.getItem(NEXT_HERO_VISIBLE_KEY) !== "off";
    let technicians = [];
    let queueEntries = [];
    let serviceGroups = [];
    let serviceGroupById = new Map();
    let TURN_TOTALS = {};
    let TURN_ANIMATION_IDS = new Set();
    let PREVIOUS_TURN_TOTALS = (() => {
      try { return JSON.parse(sessionStorage.getItem("lumi-grid-turn-totals") || "{}"); }
      catch { return {}; }
    })();
    let HAS_TURN_SNAPSHOT = Object.keys(PREVIOUS_TURN_TOTALS).length > 0;
    let lastHeroSignature = "";
    let lastSpokenSignature = "";

    const SERVICE_LABEL_SHORT = {
      mani: "Mani",
      dip_powder: "Dip",
      g_hybrid_gel: "Hybrid",
      gel_x: "Gel-X",
      pedi: "Pedi",
      gel_pedi: "Gel Pedi",
      combo: "Combo"
    };

    function escapeHtml(str){
      return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function fmtTime(value){
      if(!value) return "--";
      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return "--";
      return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    function minutesSince(value){
      if(!value) return 0;
      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return 0;
      return Math.max(0, Math.floor((Date.now() - d.getTime()) / 60000));
    }

    function waitLabel(value){
      const m = minutesSince(value);
      if(m < 1) return "Just now";
      if(m < 60) return `${m}m`;
      return `${Math.floor(m/60)}h ${m%60}m`;
    }

    function getServiceUi(q){
      const group = q?.serviceGroupId ? serviceGroupById.get(String(q.serviceGroupId)) : null;
      const groupName = group?.name || q?.serviceGroupName || "";
      const groupKey = group?.key || q?.serviceGroupKey || q?.serviceLine || "";
      if(window.LUMI_CONFIG?.serviceUiFromParts){
        return window.LUMI_CONFIG.serviceUiFromParts({
          serviceGroupKey: groupKey,
          serviceGroupName: groupName,
          serviceLine: q?.serviceLine,
          serviceName: q?.service_name || q?.serviceName || q?.service,
          service: q?.service
        });
      }
      const raw = `${groupKey} ${groupName} ${q?.serviceLine || ""} ${q?.service || ""}`.toLowerCase();
      if(raw.includes("combo")) return {key:"combo", label:"Combo", cssClass:"service-combo"};
      if(raw.includes("gel pedi") || raw.includes("gel pedicure")) return {key:"gel-pedi", label:"Gel Pedi", cssClass:"service-gel-pedi"};
      if(raw.includes("gel_x") || raw.includes("gel-x") || raw.includes("gel x") || raw.includes("gelx")) return {key:"gelx", label:"Gel-X", cssClass:"service-gelx"};
      if(raw.includes("hybrid") || raw.includes("builder")) return {key:"hybrid", label:"Hybrid", cssClass:"service-hybrid"};
      if(raw.includes("dip") || raw.includes("dipping")) return {key:"dip", label:"Dip", cssClass:"service-dip"};
      if(raw.includes("pedi") || raw.includes("pedicure")) return {key:"pedi", label:"Pedi", cssClass:"service-pedi"};
      if(raw.includes("mani") || raw.includes("manicure") || raw.includes("hand") || raw.includes("dazzle")) return {key:"mani", label:"Mani", cssClass:"service-mani"};
      return {key:"default", label:"Service", cssClass:"service-default"};
    }

    function shortServiceName(q){
      const ui = getServiceUi(q);
      if(ui?.label && ui.label !== "Service") return ui.label;
      if(q.serviceLine && SERVICE_LABEL_SHORT[q.serviceLine]) return SERVICE_LABEL_SHORT[q.serviceLine];
      const s = q.service_name || q.service || "Service";
      return s.length > 12 ? s.slice(0, 12) + "…" : s;
    }

    function normalizeTech(t, idx){
      const status = String(t.status || "ready").toLowerCase();
      return {
        id: t.id,
        name: t.name || `Staff ${idx + 1}`,
        role: t.role || "staff",
        active: t.active !== false,
        status,
        turnsTotal: Number(t.turn_balance ?? t.turns_total ?? t.turnsTotal ?? 0),
        checkInOrder: (t.check_in_order === null || t.check_in_order === undefined || t.check_in_order === "") ? null : Number(t.check_in_order),
        checkedInAt: t.checked_in_at || t.checkedInAt || null,
        currentClientId: t.current_client_id || t.currentClientId || null,
        statusChangedAt: t.status_changed_at || t.statusChangedAt || t.checked_in_at || t.created_at || null
      };
    }

    function normalizeQueue(q, idx){
      return {
        id: q.id || `queue_${idx}`,
        queueDate: q.queue_date || q.queueDate || null,
        createdAt: q.created_at || q.createdAt || null,
        name: q.customer_name || q.name || q.clientName || "Guest",
        service: q.service_name || q.service || "Service",
        serviceLine: q.service_line || "",
        serviceGroupId: q.service_group_id || q.serviceGroupId || null,
        serviceId: q.service_id || q.serviceId || null,
        serviceGroupName: q.service_group_name || q.serviceGroupName || "",
        serviceGroupKey: q.service_group_key || q.serviceGroupKey || "",
        price: Number(q.service_price ?? q.price ?? 0),
        guestType: q.guest_type || "walkin",
        requestType: q.request_type || "walkin",
        priorityTag: q.priority_tag || "none",
        requestedTechId: q.requested_tech_id || q.requestedStaffId || null,
        assignedTechId: q.assigned_tech_id || q.assigned_staff_id || null,
        status: q.status || "waiting",
        turnWeight: Number(q.turn_weight ?? q.turnWeight ?? 1),
        checkedInAt: q.checked_in_at || q.created_at || null,
        assignedAt: q.assigned_at || null,
        startedAt: q.started_at || null,
        completedAt: q.completed_at || null
      };
    }

    function statusDisplay(status){
      const s = String(status || "ready").toLowerCase();
      if(s === "ready") return {cls:"available", text:"Available"};
      if(s === "cooldown") return {cls:"refreshing", text:"Refreshing"};
      if(s === "busy") return {cls:"busy", text:"Busy"};
      if(s === "break") return {cls:"break", text:"Break"};
      return {cls:s, text:s.charAt(0).toUpperCase() + s.slice(1)};
    }

    function techName(id){
      return technicians.find(t => String(t.id) === String(id))?.name || "--";
    }

    function labelsFor(q, compact=false){
      const labels = [];
      labels.push(`<span class="lumi-label ${q.guestType === "appt" ? "appt" : "walk"}">${q.guestType === "appt" ? "Appt" : "Walk-in"}</span>`);
      labels.push(`<span class="lumi-label ${q.requestType === "requested" ? "req" : "anytech"}">${q.requestType === "requested" ? "Requested" : "Any Tech"}</span>`);
      if(q.priorityTag && q.priorityTag !== "none") labels.push(`<span class="lumi-label ${q.priorityTag}">${q.priorityTag}</span>`);
      return `<div class="${compact ? "ticket-labels" : "label-stack"}">${labels.join("")}</div>`;
    }

    function serviceClass(q){
      return getServiceUi(q)?.cssClass || "service-default";
    }

    function recentlyAssigned(q){
      const ts = q.startedAt || q.assignedAt;
      if(!ts) return false;
      const d = new Date(ts);
      if(Number.isNaN(d.getTime())) return false;
      return (Date.now() - d.getTime()) >= 0 && (Date.now() - d.getTime()) < 14000;
    }

    function ticketHtml(q, cls="dark"){
      const extra = [
        serviceClass(q),
        recentlyAssigned(q) ? "recent-assigned" : "",
        q.guestType === "appt" ? "ticket-appt" : "",
        q.requestType === "requested" ? "ticket-requested" : "",
        q.priorityTag && q.priorityTag !== "none" ? `ticket-${q.priorityTag}` : ""
      ].filter(Boolean).join(" ");
      return `<div class="ticket ${cls} ${extra}">
        <div class="ghost" style="color:#fff!important;">${escapeHtml(shortServiceName(q))}</div>
        <div class="main ${String(q.name || "").length > 12 ? "long-name" : ""}">${escapeHtml(q.name)}</div>
        ${labelsFor(q, true)}
        <div class="bottom"><span>${Number(q.turnWeight || 1)}T</span><span class="tiny">${["completed","done"].includes(String(q.status || "").toLowerCase()) ? fmtTime(q.completedAt) : waitLabel(q.checkedInAt)}</span></div>
      </div>`;
    }

    function getWaiting(){
      return queueEntries.filter(q => isTodayQueueEntry(q) && ["waiting","assigned"].includes(String(q.status).toLowerCase()))
        .sort((a,b) => new Date(a.checkedInAt || 0) - new Date(b.checkedInAt || 0));
    }

    function getServing(){
      return queueEntries.filter(q => isTodayQueueEntry(q) && ["serving","in_service"].includes(String(q.status).toLowerCase()))
        .sort((a,b) => new Date(a.startedAt || a.assignedAt || 0) - new Date(b.startedAt || b.assignedAt || 0));
    }

    function getCompleted(){
      return queueEntries.filter(q => isTodayQueueEntry(q) && ["completed","done"].includes(String(q.status).toLowerCase()))
        .sort((a,b) => new Date(b.completedAt || 0) - new Date(a.completedAt || 0));
    }

    function getTechTurn(techId){
      return Number(TURN_TOTALS[String(techId)] ?? 0);
    }

    function isAvailableTech(t){
      return t && t.active !== false && ["ready","available"].includes(String(t.status || "").toLowerCase()) && t.checkInOrder !== null;
    }

    // Original Lumi fairness order:
    // 1) Available techs first
    // 2) Lowest completed turn total first
    // 3) Tie-break by longest idle time / finished earliest
    // 4) Then name for stable display
    // Non-available techs stay below Available, grouped by status.
    function techSortRank(t){
      const status = String(t?.status || "").toLowerCase();
      if(t?.active === false || status === "off") return 5;
      if(isAvailableTech(t)) return 0;
      if(status === "cooldown" || status === "refreshing") return 1;
      if(status === "busy") return 2;
      if(status === "break") return 3;
      if(status === "ready") return 4; // ready but not checked in
      return 6;
    }


    function techLastWorkTime(techId){
      const id = String(techId || "");
      const rows = [
        ...getServing(),
        ...getCompleted()
      ].filter(row => String(row.assignedTechId || "") === id);

      const times = rows
        .map(row => row.completedAt || row.startedAt || row.assignedAt || row.checkedInAt)
        .filter(Boolean)
        .map(t => new Date(t).getTime())
        .filter(Number.isFinite);

      if(times.length) return Math.max(...times);

      const tech = technicians.find(t => String(t.id || "") === id) || {};
      const fallback = tech.lastCompletedAt || tech.lastAssignedAt || tech.statusChangedAt || tech.checkedInAt;
      const ms = fallback ? new Date(fallback).getTime() : 0;
      return Number.isFinite(ms) ? ms : 0;
    }

    function idleMinutesForTech(techId){
      const last = techLastWorkTime(techId);
      if(!last) return 9999;
      return Math.max(0, Math.floor((Date.now() - last) / 60000));
    }

    function techFairSort(a,b){
      const rankA = techSortRank(a);
      const rankB = techSortRank(b);
      if(rankA !== rankB) return rankA - rankB;

      const turnA = getTechTurn(a.id);
      const turnB = getTechTurn(b.id);
      if(turnA !== turnB) return turnA - turnB;

      // Owner rule:
      // If two available techs have the same number of turns, the tech who
      // checked in earlier stays on top. Waiting/idle time should NOT move
      // a later check-in tech above an earlier check-in tech when turns are tied.
      const checkA = a.checkInOrder == null ? Number.MAX_SAFE_INTEGER : Number(a.checkInOrder);
      const checkB = b.checkInOrder == null ? Number.MAX_SAFE_INTEGER : Number(b.checkInOrder);
      if(checkA !== checkB) return checkA - checkB;

      const idleA = techLastWorkTime(a.id);
      const idleB = techLastWorkTime(b.id);
      if(idleA !== idleB) return idleA - idleB;

      return String(a.name || "").localeCompare(String(b.name || ""));
    }

    function sortedTechniciansForGrid(){
      return technicians.slice().sort(techFairSort);
    }

    function availableTechs(){
      return technicians.filter(isAvailableTech).sort(techFairSort);
    }

    function nextCustomer(){
      const waiting = getWaiting();
      if(!waiting.length) return null;
      const priority = waiting.find(q => ["vip","owner","fix","redo"].includes(q.priorityTag));
      return priority || waiting[0];
    }

    function nextTech(){
      return availableTechs()[0] || null;
    }

    function applyDisplayMode(mode){
      const isDark = mode === "dark";
      document.body.classList.toggle("night", isDark);
      const btn = document.getElementById("modeToggleBtn");
      if(btn) btn.textContent = isDark ? "Light Mode" : "Dark Mode";
      localStorage.setItem("lumi-grid-display-mode", isDark ? "dark" : "light");
    }

    function initDisplayMode(){
      applyDisplayMode(localStorage.getItem("lumi-grid-display-mode") || "light");
      document.getElementById("modeToggleBtn")?.addEventListener("click", () => {
        applyDisplayMode(document.body.classList.contains("night") ? "light" : "dark");
      });
    }

    function setStatus(html){ document.getElementById("statusArea").innerHTML = html || ""; }

    function showToast(message){
      const toast = document.getElementById("toast");
      if(!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function speakCall(signature, text){
      if(!ENABLE_VOICE_CALL || !("speechSynthesis" in window)) return;
      if(signature === lastSpokenSignature) return;
      lastSpokenSignature = signature;
      try{
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
      }catch{}
    }

    function updateNextHeroToggleUI(){
      const btn = document.getElementById("nextHeroToggleBtn");
      if(!btn) return;
      btn.textContent = showNextHero ? "Tiếp Theo: ON" : "Tiếp Theo: OFF";
      btn.classList.toggle("on", showNextHero);
      btn.classList.toggle("off", !showNextHero);
    }

    function setNextHeroVisible(visible){
      showNextHero = !!visible;
      localStorage.setItem(NEXT_HERO_VISIBLE_KEY, showNextHero ? "on" : "off");
      updateNextHeroToggleUI();
      renderHero();
    }

    function renderHero(){
      const hero = document.getElementById("heroNext");
      if(!hero) return;
      if(!showNextHero){
        hero.innerHTML = `<div class="next-hero-mini show"><span><strong>Tiếp Theo đang ẩn</strong> — bật lại nếu muốn xem banner lớn.</span></div>`;
        return;
      }
      const next = nextCustomer();
      const tech = nextTech();
      if(!next){
        hero.innerHTML = `<div class="hero-next hero-empty"><div><div class="hero-title">No guests waiting</div><div class="hero-sub">Queue is clean right now.</div></div><div class="hero-stats"><span class="pill success">${availableTechs().length} Available</span></div></div>`;
        return;
      }
      const signature = `${next.id}-${tech?.id || "notech"}-${next.status}`;
      if(signature !== lastHeroSignature){
        lastHeroSignature = signature;
        showToast(`Next: ${next.name}${tech ? ` → ${tech.name}` : ""}`);
        speakCall(signature, `${next.name}, please come to the front desk.`);
      }
      hero.innerHTML = `<div class="hero-next">
        <div>
          <div class="hero-kicker">Next Guest</div>
          <div class="hero-title">${escapeHtml(next.name)}</div>
          <div class="hero-sub">${escapeHtml(next.service)} • ${tech ? `Best tech: ${escapeHtml(tech.name)}` : "Waiting for available tech"}</div>
          <div class="guest-mini-line">${labelsFor(next)}</div>
        </div>
        <div class="hero-stats">
          <span class="pill">${Number(next.turnWeight || 1)} Turn</span>
          <span class="pill">Wait ${waitLabel(next.checkedInAt)}</span>
          ${tech ? `<span class="pill success">${escapeHtml(tech.name)} Available • idle ${idleMinutesForTech(tech.id)}m</span>` : `<span class="pill">No tech ready</span>`}
        </div>
      </div>`;
    }

    function renderBoard(){
      const content = document.getElementById("content");
      const waiting = getWaiting();
      const serving = getServing();
      const completed = getCompleted();
      const nextT = nextTech();
      const slots = 10;

      if(!technicians.length){
        content.innerHTML = `<div class="empty-state">No staff found. Add staff in Admin first, then refresh this grid.</div>`;
        return;
      }

      const rows = sortedTechniciansForGrid()
        .map((t, idx) => {
          const sd = statusDisplay(t.status);
          const techServing = serving.filter(q => String(q.assignedTechId) === String(t.id));
          const techAssigned = waiting.filter(q => String(q.assignedTechId) === String(t.id));
          const techCompleted = completed
            .filter(q => String(q.assignedTechId) === String(t.id))
            // Older completed tickets stay on the left; current/working ticket is the right-most occupied slot.
            .sort((a,b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0));

          const techAssignedSorted = techAssigned
            .slice()
            .sort((a,b) => new Date(a.assignedAt || a.checkedInAt || 0) - new Date(b.assignedAt || b.checkedInAt || 0));

          const techServingSorted = techServing
            .slice()
            .sort((a,b) => new Date(a.startedAt || a.assignedAt || 0) - new Date(b.startedAt || b.assignedAt || 0));

          // Slot order: completed history first, then assigned/waiting, then current serving at the far right occupied slot.
          const tickets = [...techCompleted, ...techAssignedSorted, ...techServingSorted].slice(-slots);
          const cells = Array.from({length:slots}).map((_, i) => {
            const ticket = tickets[i];
            if(!ticket) return `<td class="slot-col"><div class="slot"><div class="empty"><div class="ghost-name">Open</div></div></div></td>`;
            const status = String(ticket.status || "").toLowerCase();
            const cls = techServing.some(s => String(s.id) === String(ticket.id))
              ? "serving red"
              : (["completed","done"].includes(status)
                  ? (ticket.requestType === "requested" ? "split completed" : "dark completed")
                  : (ticket.requestType === "requested" ? "split" : "dark"));
            return `<td class="slot-col"><div class="slot">${ticketHtml(ticket, cls)}</div></td>`;
          }).join("");
          const rowClass = [
            `tech-${sd.cls}`,
            nextT && String(nextT.id) === String(t.id) ? "tech-next-priority" : ""
          ].join(" ");
          const liveTurnTotal = getTechTurn(t.id);
          const turnPulseClass = TURN_ANIMATION_IDS.has(String(t.id)) ? " turn-updated" : "";
          return `<tr class="${rowClass}">
            <td class="col-index">${idx + 1}</td>
            <td class="staff-cell col-name"><div class="staff-name">${escapeHtml(t.name)}</div><div class="staff-sub"><span class="tech-status ${sd.cls}">${sd.text}</span>${t.checkInOrder !== null ? `<span class="time-chip ready">#${t.checkInOrder}</span>` : `<span class="time-chip">Not checked in</span>`}</div></td>
            <td class="col-turn"><div class="cell-center"><span class="turn-box ${sd.cls}${turnPulseClass}">${liveTurnTotal}</span></div></td>
            <td class="col-time"><div class="cell-center"><span class="time-chip ${sd.cls}">${t.status === "busy" ? "Busy" : waitLabel(t.statusChangedAt)}</span></div></td>
            ${cells}
          </tr>`;
        }).join("");

      const waitingRows = waiting.map((q, idx) => {
        const isNext = nextCustomer() && String(nextCustomer().id) === String(q.id);
        const cls = [isNext ? "next-customer-row" : "", q.requestType === "requested" ? "requested-row" : ""].join(" ");
        return `<tr class="${cls}">
          <td><span class="queue-index">${idx + 1}</span></td>
          <td><strong>${escapeHtml(q.name)}</strong><div class="guest-mini-line">${labelsFor(q)}</div></td>
          <td>${escapeHtml(q.service)}<div class="mini-note">${escapeHtml(shortServiceName(q))} • $${q.price || 0}</div></td>
          <td>${q.requestType === "requested" ? `<span class="req-pill">Requested ${escapeHtml(techName(q.requestedTechId))}</span>` : `<span class="walk-pill">Any Tech</span>`}</td>
          <td><span class="turn-pill">${Number(q.turnWeight || 1)}T</span></td>
          <td>${waitLabel(q.checkedInAt)}</td>
          <td>${q.assignedTechId ? escapeHtml(techName(q.assignedTechId)) : "--"}</td>
        </tr>`;
      }).join("");

      const completedRows = completed.slice(0, 12).map(q => `<tr>
        <td><strong>${escapeHtml(q.name)}</strong></td>
        <td>${escapeHtml(q.service)}</td>
        <td>${escapeHtml(techName(q.assignedTechId))}</td>
        <td><span class="turn-pill">${Number(q.turnWeight || 1)}T</span></td>
        <td>${fmtTime(q.completedAt)}</td>
      </tr>`).join("");

      content.innerHTML = `
        <div class="board">
          <table>
            <thead><tr><th class="col-index">#</th><th class="col-name">Tech</th><th class="col-turn">Turn</th><th class="col-time">Time</th>${Array.from({length:slots}).map((_,i)=>`<th class="slot-col">Slot ${i+1}</th>`).join("")}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="section-card">
          <div class="section-head"><div><div class="section-title">Waiting Guests</div><div class="section-sub">Live from Supabase queue_entries.</div></div><span class="pill">${waiting.length} waiting</span></div>
          ${waiting.length ? `<div class="wait-table-wrap"><table class="wait-table"><thead><tr><th>#</th><th>Guest</th><th>Service</th><th>Request</th><th>Turn</th><th>Wait</th><th>Assigned</th></tr></thead><tbody>${waitingRows}</tbody></table></div>` : `<div class="empty-queue-compact">No guests waiting.</div>`}
        </div>
        <div class="section-card">
          <div class="section-head"><div><div class="section-title">Completed Today</div><div class="section-sub">Recent completed services.</div></div><span class="pill success">${completed.length} done</span></div>
          ${completed.length ? `<div class="wait-table-wrap"><table class="wait-table"><thead><tr><th>Guest</th><th>Service</th><th>Tech</th><th>Turn</th><th>Done</th></tr></thead><tbody>${completedRows}</tbody></table></div>` : `<div class="empty-queue-compact">No completed guests yet.</div>`}
        </div>`;
    }

    function renderTopStatus(){
      document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString();
      const waiting = getWaiting().length;
      const serving = getServing().length;
      const ready = availableTechs().length;
      const done = getCompleted().length;
      const totalTurns = Object.values(TURN_TOTALS).reduce((sum, v) => sum + Number(v || 0), 0);
      setStatus(`<div class="status-box">Live Supabase Sync • ${technicians.length} staff • ${waiting} waiting • ${serving} serving • ${ready} available • ${done} completed • <span class="pill turn-total-live">${totalTurns} turns today</span></div>`);
    }

    function todayISODate(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }


function entryDate(q){
  const value =
    q.queue_date ||
    q.queueDate ||
    q.checked_in_at ||
    q.checkedInAt ||
    q.created_at ||
    q.createdAt ||
    q.completed_at ||
    q.completedAt ||
    q.assigned_at ||
    q.assignedAt;
  if(!value) return todayISODate();
  return String(value).slice(0,10);
}

function isTodayQueueEntry(q){
  return entryDate(q) === todayISODate();
}

    function buildTurnTotals(rows){
      const today = todayISODate();
      const totals = {};

      (rows || []).forEach(row => {
        const staffId = row.staff_id || row.technician_id || row.tech_id;
        if(!staffId) return;

        // Prefer transaction_date. Fall back to created_at only if transaction_date is missing.
        const rowDate = row.transaction_date || (row.created_at ? String(row.created_at).slice(0, 10) : today);
        if(rowDate !== today) return;

        totals[String(staffId)] = (totals[String(staffId)] || 0) + Number(row.amount || 0);
      });

      return totals;
    }

    function updateTurnAnimationState(nextTotals){
      const changed = new Set();
      const allIds = new Set([...Object.keys(PREVIOUS_TURN_TOTALS || {}), ...Object.keys(nextTotals || {})]);

      if(HAS_TURN_SNAPSHOT){
        allIds.forEach(id => {
          const oldValue = Number(PREVIOUS_TURN_TOTALS[id] || 0);
          const newValue = Number(nextTotals[id] || 0);
          if(oldValue !== newValue) changed.add(id);
        });
      }
      HAS_TURN_SNAPSHOT = true;

      TURN_ANIMATION_IDS = changed;
      TURN_TOTALS = nextTotals || {};
      PREVIOUS_TURN_TOTALS = {...TURN_TOTALS};

      try { sessionStorage.setItem("lumi-grid-turn-totals", JSON.stringify(PREVIOUS_TURN_TOTALS)); } catch {}

      if(changed.size){
        const names = [...changed].map(id => technicians.find(t => String(t.id) === String(id))?.name).filter(Boolean);
        if(names.length) showToast(`Turn updated: ${names.join(", ")}`);
        clearTimeout(updateTurnAnimationState._timer);
        updateTurnAnimationState._timer = setTimeout(() => {
          TURN_ANIMATION_IDS = new Set();
          renderBoard();
        }, 2800);
      }
    }

    async function loadData(showMessage=false){
      if(isLoadingData) return;
      isLoadingData = true;
      try{
        const [techRes, queueRes, turnRes, groupRes] = await Promise.all([
          supabaseClient.from("technicians").select("*").order("name", {ascending:true}),
          supabaseClient.from("queue_entries").select("*").order("checked_in_at", {ascending:true}),
          supabaseClient.from("turn_transactions").select("staff_id, amount, transaction_date, created_at"),
          supabaseClient.from("service_groups").select("*").order("display_order", {ascending:true}).order("name", {ascending:true})
        ]);
        if(techRes.error) throw techRes.error;
        if(queueRes.error) throw queueRes.error;
        if(turnRes.error) throw turnRes.error;
        if(groupRes.error && groupRes.error.code !== "42P01") throw groupRes.error;

        serviceGroups = groupRes.error ? [] : (groupRes.data || []);
        serviceGroupById = new Map(serviceGroups.map(g => [String(g.id), g]));
        technicians = (techRes.data || []).map(normalizeTech);
        queueEntries = (queueRes.data || []).map(normalizeQueue).filter(isTodayQueueEntry);

        const turnTotals = buildTurnTotals(turnRes.data || []);
        updateTurnAnimationState(turnTotals);

        technicians = technicians.map(t => ({
          ...t,
          turnsTotal: getTechTurn(t.id)
        }));

        renderHero();
        renderTopStatus();
        renderBoard();
        if(showMessage) showToast("Grid refreshed");
      }catch(err){
        console.error(err);
        setStatus(`<div class="error-box">Supabase error: ${escapeHtml(err.message || err)}</div>`);
      } finally {
        isLoadingData = false;
      }
    }

    let realtimeChannel = null;
    let pollingTimer = null;
    let realtimeHeartbeatTimer = null;
    let lastRealtimeAt = 0;
    let isLoadingData = false;

    async function handleRealtimeUpdate(payload){
      lastRealtimeAt = Date.now();
      console.log("Lumi Grid realtime update:", payload?.table, payload?.eventType, payload?.new || payload?.old || "");
      await loadData(false);
    }

    function startPollingFallback(){
      // Polling fallback keeps the TV/iPad grid live even if Supabase Realtime replication is not enabled.
      if(pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(async () => {
        if(document.hidden) return;
        await loadData(false);
      }, 3500);
    }

    function subscribeRealtime(){
      if(realtimeChannel){
        try { supabaseClient.removeChannel(realtimeChannel); } catch {}
        realtimeChannel = null;
      }

      realtimeChannel = supabaseClient
        .channel("lumi-grid-live-sync-v2")
        .on("postgres_changes", { event:"*", schema:"public", table:"queue_entries" }, handleRealtimeUpdate)
        .on("postgres_changes", { event:"*", schema:"public", table:"technicians" }, handleRealtimeUpdate)
        .on("postgres_changes", { event:"*", schema:"public", table:"turn_transactions" }, handleRealtimeUpdate)
        .on("postgres_changes", { event:"*", schema:"public", table:"staff_daily_status" }, handleRealtimeUpdate)
        .subscribe((status) => {
          console.log("Lumi Grid realtime status:", status);
          if(status === "SUBSCRIBED"){
            lastRealtimeAt = Date.now();
            showToast("Lumi Grid live sync connected");
          }
          if(["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(status)){
            console.warn("Realtime issue, polling fallback remains active:", status);
          }
        });

      // Keep a polling fallback because public Realtime replication may be disabled per table.
      startPollingFallback();

      if(realtimeHeartbeatTimer) clearInterval(realtimeHeartbeatTimer);
      realtimeHeartbeatTimer = setInterval(() => {
        // If no realtime payload has arrived for a while, polling still refreshes the grid.
        if(!lastRealtimeAt || Date.now() - lastRealtimeAt > 60000){
          console.log("Lumi Grid heartbeat: polling fallback active");
        }
      }, 30000);
    }

    function initControls(){
      initDisplayMode();
      updateNextHeroToggleUI();
      document.getElementById("nextHeroToggleBtn")?.addEventListener("click", () => setNextHeroVisible(!showNextHero));
      document.getElementById("legendBtn")?.addEventListener("click", () => document.getElementById("legendWrap")?.classList.toggle("show"));
      document.getElementById("refreshBtn")?.addEventListener("click", () => loadData(true));
    }

    document.addEventListener("DOMContentLoaded", async () => {
      initControls();
      await loadData(false);
      subscribeRealtime();
      setInterval(() => { renderHero(); renderTopStatus(); }, 30000);
    });

  </script>
</body>
</html>
