<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lumi Staff iPhone PRO</title>
  <meta name="theme-color" content="#c8a66b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumi Staff">
  <style>
    :root{
      --bg:#f7f4ef;--bg2:#fbf9f5;--panel:#ffffffee;--text:#3c342d;--muted:#7c746a;
      --line:#d8d0c4;--gold:#c8a66b;--gold-deep:#a78342;--ready:#557260;--info:#6f7f9a;
      --danger:#b45b5b;--shadow:0 18px 50px rgba(88,67,45,.10)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
      background:radial-gradient(circle at top left,rgba(200,166,107,.16),transparent 28%),linear-gradient(180deg,var(--bg2),var(--bg));
      min-height:100vh;padding-bottom:env(safe-area-inset-bottom)
    }
    .shell{max-width:560px;margin:0 auto;padding:14px}
    .top,.card,.login-card{background:var(--panel);border:1px solid rgba(255,255,255,.84);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .top{padding:16px;margin-bottom:12px;position:sticky;top:8px;z-index:5}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);font-weight:900}
    .title{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;line-height:1.05;margin-top:4px}
    .muted{color:var(--muted);line-height:1.55;font-size:14px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .pill,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
    .pill{background:#fff;border:1px solid var(--line);color:var(--gold-deep)}
    .tag.ready{background:rgba(85,114,96,.12);color:var(--ready)}
    .tag.busy{background:rgba(111,127,154,.13);color:var(--info)}
    .tag.req{background:rgba(111,127,154,.13);color:var(--info)}
    .tag.walk{background:rgba(85,114,96,.12);color:var(--ready)}
    .tag.turn{background:rgba(155,126,75,.12);color:#8d6f3f}
    .stack{display:grid;gap:12px}
    .card,.login-card{padding:16px}
    h2{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:25px}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}
    .stat small{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:6px}
    .stat strong{font-size:27px;line-height:1}
    .focus{border:1px solid rgba(200,166,107,.25);background:linear-gradient(135deg,rgba(200,166,107,.15),rgba(255,255,255,.95))}
    .client-name{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.05;font-weight:700;margin:8px 0}
    .service{font-size:18px;font-weight:800;line-height:1.35}
    .meta{color:var(--muted);font-size:14px;line-height:1.6;margin-top:6px}
    button,input,select{font:inherit}
    button{border:none;border-radius:18px;padding:15px 16px;font-size:16px;font-weight:900;cursor:pointer;transition:.15s ease}
    button:active{transform:scale(.99)}
    button[disabled]{opacity:.45;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:white;box-shadow:0 10px 22px rgba(167,131,66,.23)}
    .btn-secondary{background:white;border:1px solid var(--line);color:var(--text)}
    .btn-done{width:100%;background:rgba(85,114,96,.13);border:1px solid rgba(85,114,96,.22);color:var(--ready);font-size:20px;padding:18px}
    .btn-danger{background:rgba(180,91,91,.12);border:1px solid rgba(180,91,91,.18);color:var(--danger)}
    .empty{padding:18px;border:1px dashed #d6cec1;border-radius:18px;background:#fff;color:var(--muted);text-align:center;line-height:1.6}
    .list{display:grid;gap:10px}
    .item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}
    .item strong{font-size:17px}
    .field{display:grid;gap:8px;margin-top:12px}
    label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:900}
    input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 15px;font-size:17px;outline:none}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .hidden{display:none!important}
    .status-ok,.status-warn{padding:12px 13px;border-radius:16px;margin-bottom:12px;font-size:14px;font-weight:800;line-height:1.4}
    .status-ok{background:#f8fff8;border:1px solid #cae5ca;color:#476a47}
    .status-warn{background:#fff8ef;border:1px solid #ecd7b8;color:#8b6d3e}
    .bottom-space{height:18px}
  </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8a66b">
<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
  <div id="loginScreen" class="shell">
    <div class="login-card">
      <div class="eyebrow">Lumi Nails • Staff iPhone PRO</div>
      <div class="title">Staff Login</div>
      <div class="muted">Login bằng QR link hoặc nhập username / PIN.</div>
      <div class="field">
        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="kelly" autocomplete="username">
      </div>
      <div class="field">
        <label>PIN</label>
        <input id="loginPin" type="password" placeholder="1234" autocomplete="current-password">
      </div>
      <div class="field">
        <label>Storage key</label>
        <select id="sourceKey"><option value="lumi-turn-manager-v5">lumi-turn-manager-v5</option></select>
      </div>
      <div class="two">
        <button class="btn-primary" id="loginBtn">Login</button>
        <button class="btn-secondary" id="demoBtn">Demo</button>
      </div>
    </div>
  </div>

  <div id="appScreen" class="hidden">
    <div class="shell">
      <section class="top">
        <div class="row">
          <div>
            <div class="eyebrow">Lumi Staff</div>
            <div class="title" id="staffName">Staff</div>
            <div class="muted" id="staffSub">Ready</div>
          </div>
          <div style="display:grid;gap:8px;justify-items:end">
            <span class="pill" id="updatedAt">--:--</span>
            <button class="btn-secondary" id="logoutBtn" style="padding:9px 12px;font-size:13px">Logout</button>
          </div>
        </div>
        <div class="hero-grid">
          <div class="stat"><small>Turn</small><strong id="statTurn">0</strong></div>
          <div class="stat"><small>Status</small><strong id="statStatus">--</strong></div>
          <div class="stat"><small>Serving</small><strong id="statServing">0</strong></div>
          <div class="stat"><small>Waiting</small><strong id="statWaiting">0</strong></div>
        </div>
      </section>

      <div id="statusArea"></div>

      <section class="stack">
        <div class="card focus">
          <div class="row">
            <h2>Đang làm</h2>
            <span class="tag busy" id="currentBadge">Current</span>
          </div>
          <div id="currentBox"></div>
        </div>

        <div class="card focus">
          <div class="row">
            <h2>Khách tiếp theo</h2>
            <span class="tag turn">Next</span>
          </div>
          <div id="nextBox"></div>
        </div>

        <div class="card">
          <div class="row">
            <h2>Queue của bạn</h2>
            <span class="tag turn" id="relatedCount">0 khách</span>
          </div>
          <div class="list" id="relatedList"></div>
        </div>

        <div class="card">
          <div class="row">
            <h2>Done gần nhất</h2>
            <span class="tag ready" id="doneCount">0 khách</span>
          </div>
          <div class="list" id="doneList"></div>
        </div>
      </section>
      <div class="bottom-space"></div>
    </div>
  </div>

<script>
const DEFAULT_KEY="lumi-turn-manager-v5";
let currentSession=null;
let lastSnapshot="";

const els={
  loginScreen:document.getElementById("loginScreen"),appScreen:document.getElementById("appScreen"),
  loginUsername:document.getElementById("loginUsername"),loginPin:document.getElementById("loginPin"),sourceKey:document.getElementById("sourceKey"),
  loginBtn:document.getElementById("loginBtn"),demoBtn:document.getElementById("demoBtn"),logoutBtn:document.getElementById("logoutBtn"),
  updatedAt:document.getElementById("updatedAt"),staffName:document.getElementById("staffName"),staffSub:document.getElementById("staffSub"),
  statTurn:document.getElementById("statTurn"),statStatus:document.getElementById("statStatus"),statServing:document.getElementById("statServing"),statWaiting:document.getElementById("statWaiting"),
  statusArea:document.getElementById("statusArea"),currentBox:document.getElementById("currentBox"),nextBox:document.getElementById("nextBox"),
  relatedCount:document.getElementById("relatedCount"),relatedList:document.getElementById("relatedList"),doneCount:document.getElementById("doneCount"),doneList:document.getElementById("doneList")
};

function escapeHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function readRaw(){return localStorage.getItem(els.sourceKey.value||DEFAULT_KEY)}
function readState(){try{const raw=readRaw();return raw?JSON.parse(raw):null}catch{return null}}
function writeState(state){localStorage.setItem(els.sourceKey.value||DEFAULT_KEY,JSON.stringify(state))}
function uid(prefix){return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`}
function normalizeTech(t,i){const skills=Array.isArray(t.skills)?t.skills:(t.skill?[t.skill]:["all_services"]);return{id:t.id??String(i+1),userId:t.userId||null,name:t.name||`Staff ${i+1}`,role:t.role||"staff",skills,turnsTotal:Number(t.turnsTotal||t.turn||0),status:t.status||"ready",active:t.active!==false,currentClientId:t.currentClientId||null,checkInOrder:Number.isFinite(Number(t.checkInOrder))?Number(t.checkInOrder):null}}
function normalizeState(raw){if(!raw)return null;return{users:Array.isArray(raw.users)?raw.users:[],technicians:(raw.technicians||raw.staff||[]).map(normalizeTech),queue:Array.isArray(raw.queue)?raw.queue:[],serving:Array.isArray(raw.serving)?raw.serving:[],history:Array.isArray(raw.history)?raw.history:[],auditLog:Array.isArray(raw.auditLog)?raw.auditLog:[],dayMode:raw.dayMode||"normal",raw}}
function showLogin(show){els.loginScreen.classList.toggle("hidden",!show);els.appScreen.classList.toggle("hidden",show)}
function status(msg,type="ok"){els.statusArea.innerHTML=msg?`<div class="${type==="warn"?"status-warn":"status-ok"}">${msg}</div>`:""}
function lineFromItem(item){if(item.line)return item.line;const s=String(item.service||"").toLowerCase();if(s.includes("gel x")||s.includes("gel-x"))return"gel_x";if(s.includes("dip"))return"dip_powder";if(s.includes("hybrid"))return"g_hybrid_gel";if(s.includes("gel pedi"))return"gel_pedi";if(s.includes("pedi"))return"pedi";return"mani"}
function canDoLine(tech,line){return tech.skills.includes("all_services")||tech.skills.includes(line)}
function turnValue(item){if(typeof item.turnValue==="number")return item.turnValue;const price=Number(item.price||0);return item.requestType==="requested"?(price<65?0.5:1):1}
function timeShort(iso){if(!iso)return"--:--";return new Date(iso).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}
function waitText(item){if(!item.createdAt)return"--";const diff=Date.now()-new Date(item.createdAt).getTime();if(!Number.isFinite(diff))return"--";const mins=Math.max(0,Math.round(diff/60000));return `${mins} min`}
function findTech(state){
  if(!currentSession)return null;
  const user=state.users.find(u=>String(u.username).toLowerCase()===String(currentSession.username).toLowerCase()&&String(u.pin)===String(currentSession.pin));
  if(user){const t=state.technicians.find(x=>String(x.userId)===String(user.id));if(t)return t}
  return state.technicians.find(t=>String(t.name).toLowerCase()===String(currentSession.username).toLowerCase())||null;
}
function getSmart(client,state){
  let techs=state.technicians.filter(t=>t.active&&canDoLine(t,lineFromItem(client)));
  if(client.requestType==="requested"){
    const requested=techs.find(t=>String(t.id)===String(client.requestedTechId));
    if(!requested)return{best:null,reason:"requested tech not found"};
    if(requested.status!=="ready")return{best:null,reason:`${requested.name} busy`};
    return{best:requested,reason:"Requested bạn"};
  }
  const ready=techs.filter(t=>t.status==="ready");
  if(!ready.length)return{best:null,reason:"No ready tech"};
  ready.sort((a,b)=>Number(a.turnsTotal||0)-Number(b.turnsTotal||0)||((a.checkInOrder??999)-(b.checkInOrder??999))||String(a.name).localeCompare(String(b.name)));
  return{best:ready[0],reason:"Best match"};
}
function servingFor(state,tech){return state.serving.filter(s=>String(s.techId)===String(tech.id))}
function nextFor(state,tech){
  const q=[...state.queue].sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));
  for(const c of q){
    if(c.requestType==="requested"&&String(c.requestedTechId)===String(tech.id))return{client:c,reason:"Requested bạn"};
    if(c.requestType!=="requested"){const smart=getSmart(c,state);if(smart.best&&String(smart.best.id)===String(tech.id))return{client:c,reason:smart.reason}}
  }
  return null;
}
function relatedFor(state,tech){
  return [...state.queue].sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)).filter(c=>{
    if(c.requestType==="requested")return String(c.requestedTechId)===String(tech.id);
    const smart=getSmart(c,state);return smart.best&&String(smart.best.id)===String(tech.id);
  }).map(c=>({client:c,reason:c.requestType==="requested"?"Requested bạn":(getSmart(c,state).reason||"Best match")}));
}
function renderCurrent(state,tech){
  const list=servingFor(state,tech);
  if(!list.length){els.currentBox.innerHTML=`<div class="empty">Bạn chưa có khách đang làm.</div>`;return}
  const item=list[0];
  els.currentBox.innerHTML=`
    <div class="client-name">${escapeHtml(item.clientName)}</div>
    <div class="service">${escapeHtml(item.service)}</div>
    <div class="meta">Bắt đầu: ${timeShort(item.startedAt)} • ${item.requestType==="requested"?"Requested":"Walk-in"} • ${turnValue(item)}T</div>
    <div style="margin-top:14px"><button class="btn-done" data-done="${escapeHtml(item.id)}">✓ Done</button></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Bấm Done khi khách đã hoàn tất dịch vụ. Front Desk sẽ thấy thợ rảnh ngay.</div>
  `;
  const btn=els.currentBox.querySelector("[data-done]");
  btn.addEventListener("click",()=>markDone(item.id));
}
function renderNext(state,tech){
  const next=nextFor(state,tech);
  if(!next){els.nextBox.innerHTML=`<div class="empty">Chưa có khách tiếp theo phù hợp với bạn.</div>`;return}
  const c=next.client;
  els.nextBox.innerHTML=`
    <div class="client-name">${escapeHtml(c.name)}</div>
    <div class="service">${escapeHtml(c.service)}</div>
    <div class="meta">Wait: ${waitText(c)} • ${c.requestType==="requested"?"Requested":"Walk-in"} • ${turnValue(c)}T<br>Lý do: ${escapeHtml(next.reason)}</div>
  `;
}
function renderRelated(state,tech){
  const rows=relatedFor(state,tech);
  els.relatedCount.textContent=`${rows.length} khách`;
  if(!rows.length){els.relatedList.innerHTML=`<div class="empty">Không có khách nào đang chờ bạn.</div>`;return}
  els.relatedList.innerHTML=rows.map(({client,reason})=>`
    <div class="item">
      <div class="row"><strong>${escapeHtml(client.name)}</strong><span class="${client.requestType==="requested"?"tag req":"tag walk"}">${client.requestType==="requested"?"Requested":"Walk-in"}</span></div>
      <div class="meta">${escapeHtml(client.service)} • ${turnValue(client)}T • Wait ${waitText(client)}<br>${escapeHtml(reason)}</div>
    </div>
  `).join("");
}
function renderDone(state,tech){
  const rows=state.history.filter(h=>h.status==="done"&&String(h.techId)===String(tech.id)).sort((a,b)=>new Date(b.completedAt||b.assignedAt||0)-new Date(a.completedAt||a.assignedAt||0)).slice(0,6);
  els.doneCount.textContent=`${rows.length} khách`;
  if(!rows.length){els.doneList.innerHTML=`<div class="empty">Chưa có khách done gần đây.</div>`;return}
  els.doneList.innerHTML=rows.map(h=>`<div class="item"><div class="row"><strong>${escapeHtml(h.clientName)}</strong><span class="tag turn">${turnValue(h)}T</span></div><div class="meta">${escapeHtml(h.service)} • Done ${timeShort(h.completedAt||h.assignedAt)}</div></div>`).join("");
}
function addAudit(raw,action,detail,tech){
  raw.auditLog=Array.isArray(raw.auditLog)?raw.auditLog:[];
  raw.auditLog.unshift({id:uid("audit"),action,detail,byName:tech.name,byRole:"staff",createdAt:new Date().toISOString()});
  raw.auditLog=raw.auditLog.slice(0,100);
}
function markDone(servingId){
  const state=normalizeState(readState());
  const tech=findTech(state);
  if(!tech)return;
  const item=state.raw.serving.find(s=>String(s.id)===String(servingId)&&String(s.techId)===String(tech.id));
  if(!item){alert("Không tìm thấy khách đang làm của bạn.");return}
  if(!confirm(`Done ${item.clientName}?`))return;

  state.raw.serving=(state.raw.serving||[]).filter(s=>String(s.id)!==String(servingId));
  state.raw.technicians=(state.raw.technicians||[]).map(t=>String(t.id)===String(tech.id)?{...t,status:"ready",currentClientId:null,turnsTotal:Number(t.turnsTotal||t.turn||0)+turnValue(item)}:t);
  state.raw.history=Array.isArray(state.raw.history)?state.raw.history:[];
  const hist=state.raw.history.find(h=>String(h.clientId)===String(item.clientId)&&h.status==="serving");
  if(hist){hist.status="done";hist.completedAt=new Date().toISOString();hist.turnValue=turnValue(item)}
  else state.raw.history.unshift({id:uid("history"),clientId:item.clientId,clientName:item.clientName,service:item.service,serviceId:item.serviceId,price:item.price,line:item.line,requestType:item.requestType,techId:item.techId,techName:item.techName,assignedAt:item.startedAt,status:"done",completedAt:new Date().toISOString(),turnValue:turnValue(item)});
  addAudit(state.raw,"staff_done_client",`${tech.name} marked ${item.clientName} done from Staff iPhone PRO`,tech);
  writeState(state.raw);
  lastSnapshot="";
  refresh(true);
}
function login(){const u=els.loginUsername.value.trim(),p=els.loginPin.value.trim();if(!u||!p){alert("Nhập username và PIN.");return}currentSession={username:u,pin:p};lastSnapshot="";refresh(true)}
function demo(){const state=normalizeState(readState());if(!state||!state.technicians.length){alert("No staff data.");return}const t=state.technicians.find(x=>x.role==="staff")||state.technicians[0];const user=state.users.find(u=>String(u.id)===String(t.userId));currentSession={username:user?user.username:t.name,pin:user?user.pin:""};lastSnapshot="";refresh(true)}
function logout(){currentSession=null;lastSnapshot="";showLogin(true)}
function refresh(force=false){
  const raw=readRaw();els.updatedAt.textContent=new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  if(!raw){showLogin(true);return}
  const state=normalizeState(JSON.parse(raw));
  if(!currentSession){showLogin(true);return}
  const tech=findTech(state);
  if(!tech){showLogin(true);status("Không tìm thấy tài khoản. Kiểm tra QR/username/PIN.","warn");return}
  showLogin(false);
  if(!force&&raw===lastSnapshot)return;lastSnapshot=raw;
  els.staffName.textContent=tech.name;
  els.staffSub.textContent=`${tech.role} • ${tech.skills.includes("all_services")?"All Services":tech.skills.join(", ")}`;
  els.statTurn.textContent=String(tech.turnsTotal||0);
  els.statStatus.textContent=tech.status==="busy"?"Busy":tech.status==="ready"?"Ready":tech.status;
  els.statServing.textContent=String(servingFor(state,tech).length);
  els.statWaiting.textContent=String(relatedFor(state,tech).length);
  renderCurrent(state,tech);renderNext(state,tech);renderRelated(state,tech);renderDone(state,tech);
  status(`Đã đồng bộ cho <strong>${escapeHtml(tech.name)}</strong>. Bạn chỉ thấy việc của mình.`);
}
function autoLogin(){
  const p=new URLSearchParams(location.search);
  const u=p.get("u"), pin=p.get("p"), k=p.get("k");
  if(k)els.sourceKey.value=k;
  if(u&&pin){els.loginUsername.value=u;els.loginPin.value=pin;currentSession={username:u,pin};refresh(true)}
}
els.loginBtn.addEventListener("click",login);
els.demoBtn.addEventListener("click",demo);
els.logoutBtn.addEventListener("click",logout);
[els.loginUsername,els.loginPin].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")login()}));
autoLogin();
showLogin(!currentSession);
setInterval(()=>{if(currentSession)refresh(false)},1000);
window.addEventListener("storage",()=>{if(currentSession){lastSnapshot="";refresh(true)}});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}
</script>

</body>
</html>
