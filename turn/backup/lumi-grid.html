<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumi Nails • Luxury Grid</title>
  <style>
    :root{
      --bg:#f7f4ef;
      --bg2:#fbf9f5;
      --panel:rgba(255,255,255,.94);
      --line:#ded5c8;
      --line2:#e8dfd2;
      --text:#3c342d;
      --muted:#7c746a;
      --gold:#c8a66b;
      --gold-deep:#a78342;
      --cyan:#d7eef3;
      --pink:#fff3f4;
      --pink-text:#c75c75;
      --dark1:#111a20;
      --dark2:#04080b;
      --green:#557260;
      --green-soft:#edf6ef;
      --red:#a95858;
      --red-soft:#fff3f2;
      --blue:#6f7f9a;
      --blue-soft:#f3f5fa;
      --shadow:0 22px 70px rgba(88,67,45,.11);
      --soft-shadow:0 10px 28px rgba(88,67,45,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:
        radial-gradient(circle at top left,rgba(200,166,107,.16),transparent 25%),
        radial-gradient(circle at bottom right,rgba(220,210,198,.28),transparent 30%),
        linear-gradient(180deg,var(--bg2),var(--bg));
      color:var(--text);
      min-height:100vh;
    }
    .wrap{padding:18px;max-width:1920px;margin:0 auto}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      flex-wrap:wrap;margin-bottom:14px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:18px 20px;
      backdrop-filter:blur(10px);
    }
    .eyebrow{
      display:inline-flex;align-items:center;gap:10px;
      color:var(--gold-deep);
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:12px;
      font-weight:900;
      margin-bottom:5px;
    }
    .eyebrow:before{
      content:"";
      width:34px;height:1px;
      background:linear-gradient(90deg,var(--gold),transparent);
      display:block;
    }
    .title{
      font-size:38px;
      line-height:1.02;
      font-weight:900;
      font-family:Georgia,serif;
      letter-spacing:-.025em;
      color:var(--text);
    }
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:12px 14px;
      font:inherit;
      color:var(--text);
      cursor:pointer;
      font-weight:800;
      transition:.15s ease;
    }
    button:hover{transform:translateY(-1px)}
    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      font-size:12px;
      font-weight:900;
      color:var(--text);
      box-shadow:0 4px 14px rgba(88,67,45,.04);
      display:inline-flex;
      align-items:center;
      gap:7px;
    }
    .pill.success{background:rgba(85,114,96,.12); color:var(--green); border-color:rgba(85,114,96,.18)}
    .muted-note{color:var(--muted);font-size:14px;line-height:1.6;margin-top:4px}

    .hero-next{
      margin-bottom:14px;
      border:1px solid rgba(200,166,107,.36);
      border-radius:26px;
      box-shadow:var(--shadow);
      background:
        radial-gradient(circle at top left,rgba(200,166,107,.18),transparent 28%),
        linear-gradient(135deg,#fffaf0,#fff);
      padding:22px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    .hero-kicker{
      font-size:13px;
      letter-spacing:.17em;
      text-transform:uppercase;
      color:var(--gold-deep);
      font-weight:900;
      margin-bottom:6px;
    }
    .hero-title{
      font-size:42px;
      font-family:Georgia,serif;
      line-height:1.02;
      font-weight:900;
      letter-spacing:-.03em;
    }
    .hero-sub{font-size:16px;color:var(--muted);font-weight:800;margin-top:6px}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .hero-stats .pill{font-size:13px}

    .legend-wrap{
      margin-bottom:14px;
      display:none;
    }
    .legend-wrap.show{display:block}
    .legend{
      display:flex;gap:10px;flex-wrap:wrap;
      font-size:13px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:22px;
      box-shadow:0 12px 36px rgba(88,67,45,.08);
      padding:12px 14px;
      backdrop-filter:blur(10px);
    }
    .legend .pill{
      display:inline-flex;align-items:center;gap:8px;
      font-size:13px;
    }
    .legend .pill::before{
      content:"";
      width:16px;height:16px;border-radius:5px;
      display:inline-block;
      border:1px solid rgba(0,0,0,.08);
      flex:0 0 auto;
    }
    .legend .pill.req::before{
      background:linear-gradient(135deg,#fff 0 48%,#111a20 49% 100%);
      box-shadow:inset -4px -4px 0 rgba(200,166,107,.9);
    }
    .legend .pill.walk::before{background:#111a20}
    .legend .pill.serv::before{background:#fff;box-shadow:inset 0 0 0 3px rgba(169,88,88,.75)}
    .legend .pill.combo::before{background:repeating-linear-gradient(45deg,rgba(85,114,96,.78),rgba(85,114,96,.78) 4px,#111a20 4px,#111a20 8px)}
    .legend .pill.next::before{background:rgba(255,247,231,.95);box-shadow:inset 0 0 0 3px rgba(200,166,107,.75)}

    .board{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:24px;
      overflow:auto;
      padding:12px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .empty-state{
      background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;
      color:var(--muted);line-height:1.7
    }
    table{border-collapse:separate;border-spacing:6px;width:max-content;min-width:100%}
    th,td{border:1px solid var(--line);background:#fff;vertical-align:top;border-radius:14px}
    th{
      background:#eee7dc;padding:12px 9px;font-size:12px;text-transform:uppercase;
      letter-spacing:.12em;color:#6b6258;text-align:center;position:sticky;top:0;z-index:2;
      font-weight:900;
    }
    .col-index{width:44px;min-width:44px;text-align:center;font-weight:900}
    .col-name{width:190px;min-width:190px}
    .col-turn{width:78px;min-width:78px;text-align:center}
    .col-time{width:96px;min-width:96px;text-align:center}
    .slot-col{width:94px;min-width:94px}
    .staff-cell{
      padding:12px 10px;
      height:96px;
      background:#fff;
      box-shadow:var(--soft-shadow);
    }
    .staff-name{font-size:20px;font-weight:900;margin-bottom:8px;line-height:1.1}
    .staff-sub{
      display:flex;align-items:center;gap:8px;color:var(--muted);
      font-size:13px;flex-wrap:wrap
    }
    .turn-box{
      background:rgba(200,166,107,.14);
      color:var(--gold-deep);
      display:inline-block;
      padding:5px 8px;
      border-radius:999px;
      font-weight:900;
    }
    .time-chip{
      background:#e7f3f6;
      padding:5px 8px;
      border-radius:999px;
      display:inline-block;
      font-weight:900;
      color:#647985;
    }
    .time-chip.ready{background:rgba(85,114,96,.12); color:var(--green)}
    .time-chip.busy{background:rgba(111,127,154,.12); color:var(--blue)}
    .slot{height:96px;padding:6px;background:#fff}
    .ticket{
      height:100%;
      padding:7px 7px 6px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border-radius:12px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .ticket.dark{
      background:linear-gradient(135deg,var(--dark1),var(--dark2));
      color:#fff
    }
    .ticket.split{
      background:linear-gradient(135deg,#ffffff 0 46%,#0b1821 47% 100%);
      color:#fff
    }
    .ticket.split .ghost{color:#0b1821}
    .ticket.red{
      background:linear-gradient(135deg,#111a20 0 72%, var(--red) 73% 100%);
      color:#fff
    }
    .ticket.green{
      background:linear-gradient(135deg,#12271f,var(--green));
      color:#eafff1
    }
    .ticket.serving{
      outline:2px solid rgba(169,88,88,.95);
      outline-offset:-2px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 0 0 3px rgba(169,88,88,.10),
        0 8px 16px rgba(169,88,88,.14);
    }
    .ticket.serving::before{
      content:"Live";
      position:absolute;
      right:5px;
      bottom:5px;
      z-index:3;
      color:#ffd2d2;
      font-size:10px;
      font-weight:900;
    }
    .main{
      font-family:Georgia,serif;
      font-size:17px;
      line-height:1.05;
      font-weight:900;
      text-align:center;
      white-space:pre-line
    }
    .ghost{
      color:#e7d6ff;font-size:12px;font-weight:900;text-align:left
    }
    .bottom{
      display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;font-weight:900
    }
    .tiny{color:#f1d9a8;font-size:11px;font-weight:900}
    .accent-green{color:#45de4a}
    .accent-red{color:#ff4c4c}
    .accent-purple{color:#f0a4ff}
    .empty{
      height:100%;
      border:1px dashed #ded2c4;
      background:
        repeating-linear-gradient(45deg,rgba(0,0,0,.018),rgba(0,0,0,.018) 6px,transparent 6px,transparent 12px),
        rgba(255,255,255,.62);
      border-radius:12px;
      position:relative;
    }
    .empty::after{
      content:"+";
      position:absolute;
      right:8px;
      bottom:5px;
      color:#d6ccc0;
      font-weight:900;
      font-size:16px;
    }
    .ghost-name{color:#a4998c;font-size:12px;padding:7px;font-weight:700}

    .section-card{
      margin-top:18px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:24px;
      padding:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .section-title{
      font-size:30px;
      font-weight:900;
      font-family:Georgia,serif;
      letter-spacing:-.02em;
      margin-bottom:6px;
    }
    .section-sub{
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      margin-bottom:12px
    }
    .wait-table-wrap{overflow:auto}
    .wait-table{
      width:100%;
      min-width:860px;
      border-collapse:collapse;
      border-spacing:0
    }
    .wait-table th,.wait-table td{
      border:1px solid #e1dbd0;
      padding:13px 14px;
      background:#fff;
      vertical-align:top;
      text-align:left;
      border-radius:0;
    }
    .wait-table th{
      background:#f1ece3;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#6b6258;
      font-weight:900;
    }
    .wait-table tbody tr:nth-child(even) td{
      background:rgba(0,0,0,.012);
    }
    .wait-table tbody tr:hover td{
      background:rgba(200,166,107,.08);
    }
    .queue-index{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:30px;height:30px;border-radius:999px;background:rgba(200,166,107,.14);
      color:var(--gold-deep);font-weight:900
    }
    .req-pill,.walk-pill{
      display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900
    }
    .req-pill{background:var(--blue-soft);color:#586887}
    .walk-pill{background:var(--green-soft);color:var(--green)}
    .turn-pill{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:46px;border-radius:999px;padding:6px 10px;background:rgba(155,126,75,.12);color:#8d6f3f;font-weight:900
    }
    .status-box{
      margin-bottom:14px;
      padding:12px 14px;
      border-radius:16px;
      background:#f8fff8;
      border:1px solid #cae5ca;
      color:#476a47;
      font-weight:900;
      box-shadow:0 8px 22px rgba(85,114,96,.06);
    }
    .error-box{
      margin-top:16px;padding:16px;border-radius:16px;background:#fff6f6;border:1px solid #e7c3c3;color:#8a4545;white-space:pre-wrap
    }
    .next-customer-row td{
      background:linear-gradient(180deg, rgba(200,166,107,.14), #fff) !important;
      box-shadow:inset 4px 0 0 var(--gold);
    }
    .requested-row td{
      background:rgba(111,127,154,.045) !important;
    }
    .highlight-tech .staff-cell{
      animation:nextPulse 1.7s ease-in-out infinite;
      background:linear-gradient(135deg, rgba(255,247,231,.92), #fff);
    }
    @keyframes nextPulse{
      0%,100%{box-shadow:0 0 0 2px rgba(200,166,107,.20),0 14px 32px rgba(200,166,107,.12)}
      50%{box-shadow:0 0 0 4px rgba(200,166,107,.34),0 14px 32px rgba(200,166,107,.18)}
    }
    .next-badge{
      display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;
      background:rgba(200,166,107,.16);color:var(--gold-deep);font-weight:900;font-size:12px
    }
    .mini-note{
      color:var(--muted);font-size:12px;line-height:1.5
    }
    .busy-text{color:var(--red);font-weight:900}
    .ready-text{color:var(--green);font-weight:900}


    /* Ultimate Mode polish */
    .hero-title{
      animation:heroBreath 2.6s ease-in-out infinite;
    }
    @keyframes heroBreath{
      0%,100%{opacity:1; transform:translateY(0)}
      50%{opacity:.88; transform:translateY(-1px)}
    }
    .hero-empty .hero-title{
      animation:none;
      font-size:34px;
    }
    .hero-empty{
      background:
        radial-gradient(circle at top left,rgba(85,114,96,.10),transparent 30%),
        linear-gradient(135deg,#fff,#fbf9f5);
      border-color:rgba(85,114,96,.18);
    }
    .ticket.serving{
      animation:liveGlow 2s ease-in-out infinite;
    }
    @keyframes liveGlow{
      0%,100%{filter:brightness(1); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 3px rgba(169,88,88,.10),0 8px 16px rgba(169,88,88,.14)}
      50%{filter:brightness(1.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 4px rgba(169,88,88,.18),0 10px 22px rgba(169,88,88,.22)}
    }
    .next-customer-row td{
      position:relative;
    }
    .next-customer-row td:first-child::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:4px;
      background:var(--gold);
    }
    .highlight-tech .staff-cell{
      border-color:rgba(200,166,107,.55);
    }
    .status-box{
      transition:all .25s ease;
    }
    .toast{
      position:fixed;
      right:24px;
      bottom:24px;
      z-index:9999;
      padding:14px 16px;
      border-radius:18px;
      border:1px solid rgba(200,166,107,.32);
      background:rgba(255,255,255,.96);
      box-shadow:0 18px 48px rgba(88,67,45,.16);
      color:var(--text);
      font-weight:900;
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
      transition:.28s ease;
    }
    .toast.show{
      opacity:1;
      transform:translateY(0);
    }
    .topbar{
      position:sticky;
      top:10px;
      z-index:10;
    }
    body.night{
      --bg:#1f1b17;
      --bg2:#28231d;
      --panel:rgba(41,35,29,.92);
      --text:#f7f1e8;
      --muted:#c9bba8;
      --line:#4a4035;
      --line2:#584c3f;
    }
    body.night th{background:#3a3128;color:#d8c8b5}
    body.night td, body.night .staff-cell, body.night .slot, body.night .section-card, body.night .board, body.night .topbar{background:rgba(42,36,30,.92)}
    body.night .empty{background:rgba(255,255,255,.04)}
    body.night .hero-next{background:linear-gradient(135deg,#3a3128,#2a241e)}
    body.night .status-box{background:rgba(85,114,96,.16)}
    @media (min-width:1400px){
      .hero-title{font-size:46px}
      .wrap{padding:22px}
    }

    @media (max-width:900px){
      .title{font-size:28px}
      .hero-title{font-size:30px}
      .staff-name{font-size:16px}
      .slot,.staff-cell{height:82px}
      .main{font-size:14px}
      .wrap{padding:12px}
    }


    #modeToggleBtn{
      min-width:110px;
    }
    body.night #modeToggleBtn{
      background:rgba(255,255,255,.92) !important;
      color:#3c342d !important;
      border-color:rgba(255,255,255,.65) !important;
    }

    /* Night mode contrast fix */
    body.night button,
    body.night .pill,
    body.night .legend .pill,
    body.night .hero-stats .pill {
      background: rgba(255,255,255,.92) !important;
      color: #3c342d !important;
      border-color: rgba(255,255,255,.65) !important;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }

    body.night .pill.success,
    body.night .hero-stats .pill.success {
      background: rgba(85,114,96,.28) !important;
      color: #dff1e3 !important;
      border-color: rgba(125,165,137,.38) !important;
    }

    body.night .legend {
      background: rgba(41,35,29,.92) !important;
      border-color: rgba(255,255,255,.28) !important;
    }

    body.night .hero-next {
      border-color: rgba(200,166,107,.42) !important;
    }

    body.night .topbar,
    body.night .hero-next,
    body.night .board,
    body.night .section-card {
      border-color: rgba(255,255,255,.18) !important;
    }

    body.night .status-box {
      color: #dff1e3 !important;
      border-color: rgba(125,165,137,.35) !important;
    }

    body.night .time-chip {
      background: rgba(255,255,255,.12) !important;
      color: #f7f1e8 !important;
    }

    body.night .time-chip.ready {
      background: rgba(85,114,96,.28) !important;
      color: #dff1e3 !important;
    }

    body.night .time-chip.busy {
      background: rgba(111,127,154,.30) !important;
      color: #e4ebff !important;
    }


    /* Lumi Color System v2 — clear, luxury, fast to scan */
    :root{
      --state-ready-bg:rgba(85,114,96,.16);
      --state-ready-text:#46634f;
      --state-ready-border:rgba(85,114,96,.28);

      --state-busy-bg:rgba(111,127,154,.16);
      --state-busy-text:#526179;
      --state-busy-border:rgba(111,127,154,.26);

      --state-serving-1:#6f1f1f;
      --state-serving-2:#b23a3a;
      --state-serving-glow:rgba(178,58,58,.32);

      --state-next-bg:rgba(200,166,107,.18);
      --state-next-text:#8a6c36;
      --state-next-border:rgba(200,166,107,.38);

      --state-requested-bg:rgba(111,127,154,.13);
      --state-requested-text:#596a88;

      --state-walkin-bg:rgba(85,114,96,.13);
      --state-walkin-text:#4f725d;
    }

    .time-chip.ready,
    .pill.success{
      background:var(--state-ready-bg) !important;
      color:var(--state-ready-text) !important;
      border-color:var(--state-ready-border) !important;
    }

    .time-chip.busy{
      background:var(--state-busy-bg) !important;
      color:var(--state-busy-text) !important;
      border-color:var(--state-busy-border) !important;
    }

    .next-badge,
    .turn-pill,
    .queue-index,
    .turn-box{
      background:var(--state-next-bg) !important;
      color:var(--state-next-text) !important;
      border-color:var(--state-next-border) !important;
    }

    .req-pill{
      background:var(--state-requested-bg) !important;
      color:var(--state-requested-text) !important;
    }

    .walk-pill{
      background:var(--state-walkin-bg) !important;
      color:var(--state-walkin-text) !important;
    }

    /* Stronger LIVE / serving ticket */
    .ticket.serving{
      outline:2px solid rgba(255,255,255,.45) !important;
      outline-offset:-3px;
      background:linear-gradient(135deg,var(--state-serving-1),var(--state-serving-2)) !important;
      color:#fff !important;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.18),
        0 0 0 3px rgba(178,58,58,.18),
        0 10px 24px var(--state-serving-glow) !important;
      animation:servingPulse 1.9s ease-in-out infinite !important;
    }

    .ticket.serving .ghost,
    .ticket.serving .main,
    .ticket.serving .bottom,
    .ticket.serving .tiny{
      color:#fff !important;
    }

    .ticket.serving::before{
      background:rgba(255,255,255,.16);
      color:#fff !important;
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      padding:2px 5px;
      right:6px !important;
      bottom:6px !important;
    }

    @keyframes servingPulse{
      0%,100%{
        transform:scale(1);
        filter:brightness(1);
      }
      50%{

</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="eyebrow">Lumi Nails • Luxury Grid</div>
        <div class="title">Lumi Nails • Luxury Grid</div>
        <div class="muted-note">Luxury display mode for Lumi Nails.</div>
      </div>
      <div class="controls">
        <span class="pill success">Live Sync</span>
        <button id="modeToggleBtn" type="button">Light Mode</button>
        <span class="pill" id="lastUpdated">--:--:--</span>
        <button id="nextHeroToggleBtn" class="next-hero-toggle on" type="button">Tiếp Theo: ON</button>
        <button id="legendBtn" type="button">Legend</button>
        <button id="refreshBtn" type="button">Refresh</button>
        <button onclick="window.print()" type="button">Print</button>
      </div>
    </div>

    <div id="heroNext"></div>

    <div id="legendWrap" class="legend-wrap">
      <div class="legend">
        <div class="pill walk">Walk-in = khách mới không hẹn</div>
        <div class="pill req">Requested = yêu cầu thợ cụ thể</div>
        <div class="pill next">Appt = khách có lịch hẹn</div>
        <div class="pill combo">VIP / Owner Guest / Fix / Redo = priority tag</div>
        <div class="pill serv">Serving = đang phục vụ</div>
      </div>
    </div>

    <div id="statusArea"></div>
    <div id="content"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const STORAGE_KEY = "lumi-turn-manager-v5";
    const NEXT_HERO_VISIBLE_KEY = "lumi-grid-show-next-hero";
    let showNextHero = localStorage.getItem(NEXT_HERO_VISIBLE_KEY) !== "off";
    const ENABLE_VOICE_CALL = false; // đổi thành true nếu muốn TV/iPad tự đọc tên khách
    let lastHeroSignature = "";
    let lastSpokenSignature = "";

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function speakCall(signature, text) {
      if (!ENABLE_VOICE_CALL || !("speechSynthesis" in window)) return;
      if (signature === lastSpokenSignature) return;
      lastSpokenSignature = signature;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.92;
        utter.pitch = 1.02;
        window.speechSynthesis.speak(utter);
      } catch {}
    }

    function applyDisplayMode(mode) {
      const isDark = mode === "dark";
      document.body.classList.toggle("night", isDark);
      const btn = document.getElementById("modeToggleBtn");
      if (btn) btn.textContent = isDark ? "Light Mode" : "Dark Mode";
      localStorage.setItem("lumi-grid-display-mode", isDark ? "dark" : "light");
    }

    function initDisplayMode() {
      const savedMode = localStorage.getItem("lumi-grid-display-mode") || "light";
      applyDisplayMode(savedMode);
      const btn = document.getElementById("modeToggleBtn");
      if (btn) {
        btn.addEventListener("click", () => {
          const nextMode = document.body.classList.contains("night") ? "light" : "dark";
          applyDisplayMode(nextMode);
        });
      }
    }

    initDisplayMode();

    const SERVICE_LABEL_SHORT = {
      mani: "Mani",
      dip_powder: "Dip",
      g_hybrid_gel: "Hybrid",
      gel_x: "Gel-X",
      pedi: "Pedi",
      gel_pedi: "Gel Pedi"
    };

    const SERVICE_PRICE_SHORTCUTS = [
      { test: /gel x|gel-x/i, label: "Gel-X" },
      { test: /dip/i, label: "Dip" },
      { test: /hybrid/i, label: "Hybrid" },
      { test: /gel pedi/i, label: "Gel Pedi" },
      { test: /pedi/i, label: "Pedi" },
      { test: /mani|dazzle|hand/i, label: "Mani" }
    ];


    function updateNextHeroToggleUI(){
      const btn = document.getElementById("nextHeroToggleBtn");
      if(!btn) return;
      btn.textContent = showNextHero ? "Tiếp Theo: ON" : "Tiếp Theo: OFF";
      btn.classList.toggle("on", showNextHero);
      btn.classList.toggle("off", !showNextHero);
    }

    function setNextHeroVisible(visible){
      showNextHero = !!visible;
      localStorage.setItem(NEXT_HERO_VISIBLE_KEY, showNextHero ? "on" : "off");
      updateNextHeroToggleUI();
      document.body.classList.toggle('hide-next-hero', !showNextHero);
      applyNextHeroVisibility();
    }

    function ensureNextHeroMini(){
      let mini = document.getElementById("nextHeroMini");
      if(mini) return mini;

      const hero = document.querySelector(".hero-next");
      mini = document.createElement("div");
      mini.id = "nextHeroMini";
      mini.className = "next-hero-mini";
      mini.innerHTML = `<span><strong>Tiếp Theo đang ẩn</strong> — bật lại nếu muốn xem banner lớn.</span>`;

      if(hero && hero.parentNode){
        hero.parentNode.insertBefore(mini, hero.nextSibling);
      } else {
        const board = document.querySelector(".board");
        if(board && board.parentNode) board.parentNode.insertBefore(mini, board);
      }

      return mini;
    }

    function applyNextHeroVisibility(){
      document.body.classList.toggle("hide-next-hero", !showNextHero);

      const heroes = document.querySelectorAll(".hero-next, #heroNext, #nextHero, .next-hero-card");
      heroes.forEach(hero => {
        hero.classList.toggle("hidden-next-hero", !showNextHero);
        hero.style.display = showNextHero ? "" : "none";
      });

      let mini = document.getElementById("nextHeroMini");
      if(!mini && !showNextHero){
        mini = document.createElement("div");
        mini.id = "nextHeroMini";
        mini.className = "next-hero-mini";
        mini.innerHTML = `<span><strong>Tiếp Theo đang ẩn</strong> — bật lại nếu muốn xem banner lớn.</span>`;

        const status = document.querySelector(".status-box");
        const board = document.querySelector(".board");
        const anchor = status || board;
        if(anchor && anchor.parentNode){
          anchor.parentNode.insertBefore(mini, anchor);
        } else {
          document.querySelector(".wrap")?.appendChild(mini);
        }
      }

      if(mini){
        mini.classList.toggle("show", !showNextHero);
      }
    }


    function setStatus(html) {
      document.getElementById("statusArea").innerHTML = html || "";
    }

    function readState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function normalizeTechnician(t, idx) {
      const skills = Array.isArray(t.skills) ? t.skills : (t.skill ? [t.skill] : ["all_services"]);
      return {
        id: t.id ?? idx + 1,
        userId: t.userId || null,
        name: t.name || `Staff ${idx + 1}`,
        role: t.role || "staff",
        skills,
        turnsTotal: Number(t.turnsTotal ?? t.turns_total ?? t.turn ?? 0),
        status: t.status || "ready",
        active: t.active !== false,
        currentClientId: t.currentClientId || t.current_client_id || null,
        checkInOrder: Number.isFinite(Number(t.checkInOrder ?? t.check_in_order)) ? Number(t.checkInOrder ?? t.check_in_order) : null,
        checkedInAt: t.checkedInAt || t.checked_in_at || null,
        refreshingStartedAt: t.refreshingStartedAt || t.refreshing_started_at || null,
        statusChangedAt: t.statusChangedAt || t.status_changed_at || t.startedAt || t.started_at || t.checkedInAt || t.checked_in_at || t.createdAt || t.created_at || null,
        createdAt: t.createdAt || t.created_at || null
      };
    }

    function normalizeQueueItem(q, idx) {
      return {
        id: q.id || q.clientId || `queue_${idx}`,
        name: q.name || q.clientName || "",
        service: q.service || q.serviceName || "",
        line: q.line || q.group || null,
        guestType: q.guestType || q.guest_type || q.customerType || q.customer_type || "walkin",
        requestType: q.requestType || q.request_type || "walkin",
        priorityTag: q.priorityTag || q.priority_tag || "none",
        requestedTechId: q.requestedTechId || q.requested_tech_id || null,
        requestedTechName: q.requestedTechName || q.requested_tech_name || "",
        appointmentTime: q.appointmentTime || q.appointment_time || q.apptTime || q.appt_time || null,
        price: Number(q.price || 0),
        createdAt: q.createdAt || q.created_at || new Date().toISOString(),
        source: q.source || q.addedBy || ""
      };
    }

    function normalizeServingItem(s, idx) {
      return {
        id: s.id || `serving_${idx}`,
        clientId: s.clientId || s.client_id || null,
        clientName: s.clientName || s.client_name || s.name || "",
        service: s.service || "",
        line: s.line || s.group || null,
        guestType: s.guestType || s.guest_type || s.customerType || s.customer_type || "walkin",
        requestType: s.requestType || s.request_type || "walkin",
        priorityTag: s.priorityTag || s.priority_tag || "none",
        requestedTechId: s.requestedTechId || s.requested_tech_id || null,
        requestedTechName: s.requestedTechName || s.requested_tech_name || "",
        appointmentTime: s.appointmentTime || s.appointment_time || s.apptTime || s.appt_time || null,
        techId: s.techId || s.tech_id || null,
        techName: s.techName || s.tech_name || "",
        price: Number(s.price || 0),
        turnValue: typeof s.turnValue === "number" ? s.turnValue : (typeof s.turn_value === "number" ? s.turn_value : undefined),
        startedAt: s.startedAt || s.started_at || s.assignedAt || s.assigned_at || new Date().toISOString()
      };
    }

    function normalizeHistoryItem(h, idx) {
      return {
        id: h.id || `history_${idx}`,
        clientId: h.clientId || h.client_id || null,
        clientName: h.clientName || h.client_name || h.name || "",
        service: h.service || "",
        line: h.line || h.group || null,
        guestType: h.guestType || h.guest_type || h.customerType || h.customer_type || "walkin",
        requestType: h.requestType || h.request_type || "walkin",
        priorityTag: h.priorityTag || h.priority_tag || "none",
        requestedTechId: h.requestedTechId || h.requested_tech_id || null,
        requestedTechName: h.requestedTechName || h.requested_tech_name || "",
        appointmentTime: h.appointmentTime || h.appointment_time || h.apptTime || h.appt_time || null,
        techId: h.techId || h.tech_id || null,
        techName: h.techName || h.tech_name || "",
        status: h.status || "done",
        price: Number(h.price || 0),
        turnValue: typeof h.turnValue === "number" ? h.turnValue : (typeof h.turn_value === "number" ? h.turn_value : undefined),
        assignedAt: h.assignedAt || h.assigned_at || h.startedAt || h.started_at || h.createdAt || h.created_at || null,
        completedAt: h.completedAt || h.completed_at || null
      };
    }

    function normalizeState(state) {
      if (!state) return null;
      const techniciansRaw = state.technicians || state.staff || [];
      const technicians = techniciansRaw.map(normalizeTechnician);
      const queue = Array.isArray(state.queue) ? state.queue.map(normalizeQueueItem) : [];
      const serving = Array.isArray(state.serving) ? state.serving.map(normalizeServingItem) : [];
      const history = Array.isArray(state.history) ? state.history.map(normalizeHistoryItem) : [];
      return {
        technicians,
        queue,
        serving,
        history,
        dayMode: state.dayMode || "normal",
        turnSettings: state.turnSettings || null,
        lastAssignedByLine: state.lastAssignedByLine || {}
      };
    }

    function getTurnSettings(state) {
      return state.turnSettings || {
        requestedThreshold: 65,
        requestedBelowTurn: 0.5,
        requestedAtOrAboveTurn: 1,
        walkInTurn: 1
      };
    }

    function shortService(item) {
      if (item.line && SERVICE_LABEL_SHORT[item.line]) return SERVICE_LABEL_SHORT[item.line];
      const service = item.service || "";
      for (const rule of SERVICE_PRICE_SHORTCUTS) {
        if (rule.test.test(service)) return rule.label;
      }
      return service.split(" ").slice(0, 2).join(" ") || "Service";
    }

    function lineFromItem(item) {
      if (item.line) return item.line;
      const label = shortService(item).toLowerCase();
      if (label.includes("gel-x")) return "gel_x";
      if (label.includes("dip")) return "dip_powder";
      if (label.includes("hybrid")) return "g_hybrid_gel";
      if (label.includes("gel pedi")) return "gel_pedi";
      if (label.includes("pedi")) return "pedi";
      return "mani";
    }

    function turnValue(item, state) {
      if (typeof item.turnValue === "number") return item.turnValue;
      const settings = getTurnSettings(state || {});
      const price = Number(item.price || 0);
      if (item.requestType === "requested") {
        return price < Number(settings.requestedThreshold)
          ? Number(settings.requestedBelowTurn)
          : Number(settings.requestedAtOrAboveTurn);
      }
      return Number(settings.walkInTurn);
    }

    function canDoLine(tech, lineKey) {
      return tech.skills.includes("all_services") || tech.skills.includes(lineKey);
    }

    function minutesSince(iso) {
      if (!iso) return 0;
      const t = new Date(iso).getTime();
      if (!Number.isFinite(t)) return 0;
      return Math.max(0, Math.round((Date.now() - t) / 60000));
    }

    function formatDurationFromMinutes(mins) {
      if (!Number.isFinite(mins)) return "--:--";
      const hh = String(Math.floor(mins / 60)).padStart(2, "0");
      const mm = String(mins % 60).padStart(2, "0");
      return `${hh}:${mm}`;
    }


    function techStatusLabel(tech){
      if(!tech.active || tech.status === "off") return {cls:"break", text:"Off"};
      if(tech.status === "busy") return {cls:"busy", text:"Busy"};
      if(tech.status === "break") return {cls:"break", text:"Break"};
      if(tech.status === "cooldown") return {cls:"refreshing", text:"Refreshing"};
      return {cls:"available", text:"Available"};
    }

    function techRowClass(tech){
      if(tech.status === "busy") return "tech-busy";
      if(tech.status === "break") return "tech-break";
      if(tech.status === "cooldown") return "tech-refreshing";
      return "tech-available";
    }

    function getTechDuration(tech, serving, history) {
      if (tech.status === "break") {
        return { label: "—", status: "break", detail: "Break" };
      }

      if (tech.status === "cooldown") {
        const base = tech.refreshingStartedAt || tech.cooldownStartedAt || tech.statusChangedAt || tech.checkedInAt || tech.createdAt || new Date().toISOString();
        return {
          label: formatDurationFromMinutes(minutesSince(base)),
          status: "cooldown",
          detail: "Refreshing"
        };
      }

      const current = serving.find(s => String(s.techId) === String(tech.id));
      if (current) {
        return {
          label: formatDurationFromMinutes(minutesSince(current.startedAt)),
          status: "busy",
          detail: "Busy"
        };
      }

      const finished = history
        .filter(h => String(h.techId) === String(tech.id))
        .map(h => h.completedAt || h.assignedAt)
        .filter(Boolean)
        .sort((a,b) => new Date(b).getTime() - new Date(a).getTime())[0];

      const base = finished || tech.checkedInAt || tech.createdAt || new Date().toISOString();
      return {
        label: formatDurationFromMinutes(minutesSince(base)),
        status: tech.status === "ready" ? "ready" : "busy",
        detail: tech.status === "ready" ? "Available" : tech.status === "busy" ? "Busy" : "Off"
      };
    }

    function nextCandidateForTech(tech, state) {
      const available = tech.active && tech.status === "ready";
      if (!available) return null;

      const requested = state.queue.find(q => q.requestType === "requested" && String(q.requestedTechId) === String(tech.id));
      if (requested) return { ...requested, _nextType: "requested" };

      const queue = [...state.queue].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
      for (const client of queue) {
        if (client.requestType === "requested") continue;
        if (!canDoLine(tech, lineFromItem(client))) continue;

        const eligibleAvailable = state.technicians.filter(t => t.active && t.status === "ready" && canDoLine(t, lineFromItem(client)));
        if (!eligibleAvailable.length) continue;

        const minTurn = Math.min(...eligibleAvailable.map(t => Number(t.turnsTotal || 0)));
        const winner = eligibleAvailable
          .filter(t => Number(t.turnsTotal || 0) === minTurn)
          .sort((a, b) => {
            const ac = a.checkInOrder == null ? Number.MAX_SAFE_INTEGER : a.checkInOrder;
            const bc = b.checkInOrder == null ? Number.MAX_SAFE_INTEGER : b.checkInOrder;
            if (ac !== bc) return ac - bc;
            return String(a.name).localeCompare(String(b.name));
          })[0];

        if (winner && String(winner.id) === String(tech.id)) {
          return { ...client, _nextType: "walkin-fair" };
        }
      }
      return null;
    }

    function tilesForTech(tech, state, maxHistorySlots) {
      const completed = state.history
        .filter(h => String(h.techId) === String(tech.id) && h.status === "done")
        .sort((a, b) => new Date(a.completedAt || a.assignedAt || 0) - new Date(b.completedAt || b.assignedAt || 0));

      const current = state.serving
        .filter(s => String(s.techId) === String(tech.id))
        .sort((a, b) => new Date(a.startedAt || 0) - new Date(b.startedAt || 0));

      const all = [...completed, ...current].slice(-maxHistorySlots);
      return all.map(item => ({
        item,
        service: shortService(item),
        serviceFull: item.service || "",
        guestType: guestTypeOf(item),
        requested: item.requestType === "requested",
        priorityTag: priorityTagOf(item),
        requestedTechName: requestedTechNameOf(item, state),
        labelsHtml: labelStack(item, state, false),
        labelText: shortLabelText(item, state),
        turn: turnValue(item, state),
        serving: current.some(s => String(s.id) === String(item.id)),
        combo: /comb|combo/i.test(item.service || ""),
        regular: /reg|regular/i.test(item.service || ""),
        green: /combo|vip|brow|wax/i.test(item.service || "") || priorityTagOf(item) === "vip",
        red: (/gel|luxury|royal/i.test(item.service || "") && !/gel-x/i.test(item.service || "")) || ["fix","redo"].includes(priorityTagOf(item)),
        time: item.completedAt || item.startedAt || item.assignedAt || null
      }));
    }

    function ticketClass(tile) {
      if (tile.green) return "green";
      if (tile.red) return "red";
      if (tile.requested) return "split";
      return "dark";
    }

    function renderTicket(tile) {
      const cls = ticketClass(tile);
      const tag = tile.requested ? "Appt" : tile.service;
      const bottomRight = tile.requested ? "Appt" : (tile.regular ? "Reg" : "");
      const turnText = `${tile.turn}T`;
      return `
        <div class="ticket ${cls} ${tile.serving ? 'serving' : ''}">
          <div class="ghost">${tag}</div>
          <div class="main ${tile.green ? 'accent-green' : tile.red ? 'accent-red' : ''}">${tile.service}\n${turnText}</div>
          <div class="bottom">
            <span class="tiny">${tile.turn}</span>
            <span class="${tile.requested ? 'accent-purple' : ''}">${bottomRight}</span>
          </div>
        </div>
      `;
    }

    function renderEmpty(name="") {
      return `<div class="empty">${name ? `<div class="ghost-name">${name}</div>` : ""}</div>`;
    }


    function statusDisplayLabel(status){
      if(status === "ready") return "Available";
      if(status === "cooldown") return "Refreshing";
      if(status === "busy") return "Busy";
      if(status === "break") return "Break";
      if(status === "off") return "Off";
      return status || "--";
    }

    function statusDisplayClass(status){
      if(status === "ready") return "available";
      if(status === "cooldown") return "refreshing";
      return status || "";
    }

    function refreshingMinutes(tech){
      if(!tech || tech.status !== "cooldown") return 0;
      const base = tech.refreshingStartedAt || tech.statusChangedAt || tech.checkedInAt;
      if(!base) return 0;
      const diff = Date.now() - new Date(base).getTime();
      if(!Number.isFinite(diff)) return 0;
      return Math.max(0, Math.floor(diff / 60000));
    }

    function refreshingReminderHtml(tech){
      const mins = refreshingMinutes(tech);
      if(mins < 5) return "";
      return `<div class="refreshing-reminder">✨ ${escapeHtml(tech.name || "Tech")} has been Refreshing for ${mins} min. Check if they are Available — no auto-assign happens until Available is tapped.</div>`;
    }


    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    const LUMI_GUEST_TYPES = {
      walkin:{cls:"walk",icon:"●",text:"Walk-in"},
      appt:{cls:"appt",icon:"◷",text:"Appt"}
    };
    const LUMI_REQUEST_TYPES = {
      walkin:{cls:"anytech",icon:"✓",text:"Any Tech"},
      requested:{cls:"req",icon:"🎯",text:"Requested"}
    };
    const LUMI_PRIORITY_TAGS = {
      vip:{cls:"vip",icon:"◆",text:"VIP"},
      owner:{cls:"owner",icon:"★",text:"Owner Guest"},
      fix:{cls:"fix",icon:"✚",text:"Fix"},
      redo:{cls:"redo",icon:"↺",text:"Redo"}
    };

    function guestTypeOf(item){
      if(item?.guestType === "appt" || item?.guest_type === "appt") return "appt";
      return "walkin";
    }

    function priorityTagOf(item){
      const tag = item?.priorityTag || item?.priority_tag || "none";
      return tag && tag !== "none" ? tag : "";
    }

    function requestedTechNameOf(item, state){
      if(item?.requestedTechName) return item.requestedTechName;
      if(item?.requestedTechId && state?.technicians){
        const tech = state.technicians.find(t => String(t.id) === String(item.requestedTechId));
        if(tech) return tech.name;
      }
      return "Tech";
    }

    function lumiLabel(meta, text){
      return `<span class="lumi-label ${meta.cls}">${escapeHtml(text)}</span>`;
    }

    function labelStack(item, state, includeAny = true){
      const guestMeta = LUMI_GUEST_TYPES[guestTypeOf(item)] || LUMI_GUEST_TYPES.walkin;
      const labels = [lumiLabel(guestMeta, `${guestMeta.icon} ${guestMeta.text}`)];
      const isRequested = item?.requestType === "requested";
      if(isRequested){
        labels.push(lumiLabel(LUMI_REQUEST_TYPES.requested, `${LUMI_REQUEST_TYPES.requested.icon} Requested • ${requestedTechNameOf(item,state)}`));
      }else if(includeAny){
        labels.push(lumiLabel(LUMI_REQUEST_TYPES.walkin, `${LUMI_REQUEST_TYPES.walkin.icon} Any Tech`));
      }
      const p = priorityTagOf(item);
      if(p && LUMI_PRIORITY_TAGS[p]){
        const pm = LUMI_PRIORITY_TAGS[p];
        labels.push(lumiLabel(pm, `${pm.icon} ${pm.text}`));
      }
      return `<div class="label-stack">${labels.join("")}</div>`;
    }

    function shortLabelText(item, state){
      const parts = [];
      parts.push(guestTypeOf(item) === "appt" ? "Appt" : "Walk-in");
      if(item?.requestType === "requested") parts.push(`Requested ${requestedTechNameOf(item,state)}`);
      else parts.push("Any Tech");
      const p = priorityTagOf(item);
      if(p && LUMI_PRIORITY_TAGS[p]) parts.push(LUMI_PRIORITY_TAGS[p].text);
      return parts.join(" • ");
    }

    function waitTimeText(item) {
      if (!item || !item.createdAt) return "--:--";
      return formatDurationFromMinutes(minutesSince(item.createdAt));
    }

    function getSmartCandidates(client, state) {
      let techs = state.technicians.filter(t => t.active && canDoLine(t, lineFromItem(client)));

      if (client.requestType === "requested") {
        const requested = techs.find(t => String(t.id) === String(client.requestedTechId));
        if (!requested) return { best:null, reason:"Không tìm thấy thợ yêu cầu" };
        if (requested.status !== "ready") return { best:null, reason:`${requested.name} đang bận` };
        return { best:requested, reason:"Khách yêu cầu" };
      }

      const available = techs.filter(t => t.status === "ready");
      if (!available.length) return { best:null, reason:"Chưa có thợ phù hợp" };

      const sorted = [...available].sort((a,b) => {
        if (Number(a.turnsTotal || 0) !== Number(b.turnsTotal || 0)) {
          return Number(a.turnsTotal || 0) - Number(b.turnsTotal || 0);
        }
        const ac = a.checkInOrder == null ? Number.MAX_SAFE_INTEGER : a.checkInOrder;
        const bc = b.checkInOrder == null ? Number.MAX_SAFE_INTEGER : b.checkInOrder;
        if (ac !== bc) return ac - bc;
        return String(a.name).localeCompare(String(b.name));
      });

      return { best: sorted[0], reason:"Ít turn nhất" };
    }

    function getBestNextCustomer(state) {
      if (!state || !state.queue?.length) return null;
      const queue = [...state.queue].sort((a,b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
      for (const client of queue) {
        const smart = getSmartCandidates(client, state);
        if (smart.best) return { client, tech:smart.best, reason:smart.reason };
      }
      return null;
    }

    function suggestionForQueueItem(item, state, bestNext) {
      if (bestNext && bestNext.client && String(bestNext.client.id) === String(item.id)) {
        return `<span class="next-badge">Tiếp theo</span><div class="available-text" style="margin-top:6px;">${escapeHtml(bestNext.tech?.name || "")}</div><div class="mini-note">${escapeHtml(bestNext.reason || "")}</div>`;
      }

      if (item.requestType === "requested") {
        const requestedTech = item.requestedTechId ? state.technicians.find(t => String(t.id) === String(item.requestedTechId)) : null;
        if (!requestedTech) return `<span class="mini-note">—</span>`;
        if (requestedTech.status === "busy") return `<span class="busy-text">${escapeHtml(requestedTech.name)} đang bận</span>`;
        if (requestedTech.active === false) return `<span class="busy-text">${escapeHtml(requestedTech.name)} đang off</span>`;
        return `<span class="available-text">${escapeHtml(requestedTech.name)} available</span>`;
      }

      const smart = getSmartCandidates(item, state);
      if (smart.best) return `<span class="available-text">${escapeHtml(smart.best.name)} phù hợp</span>`;
      return `<span class="mini-note">—</span>`;
    }

    function renderHero(state) {
      const bestNext = getBestNextCustomer(state);
      const waiting = state.queue.length;
      const available = state.technicians.filter(t => t.active && t.status === "ready").length;
      const serving = state.serving.length;

      const hero = document.getElementById("heroNext");

      if (!waiting) {
        hero.innerHTML = `
          <div class="hero-next hero-empty">
            <div>
              <div class="hero-title">✨ Salon available đón khách tiếp theo</div>
              <div class="hero-sub">Không có khách đang chờ.</div>
            </div>
            <div class="hero-stats">
              <span class="pill">${waiting} waiting</span>
              <span class="pill success">${available} available</span>
              <span class="pill">${serving} serving</span>
            </div>
          </div>
        `;
        const signature = "empty";
        if (lastHeroSignature !== signature) {
          lastHeroSignature = signature;
          showToast("Danh sách chờ hiện đang trống.");
        }
        return;
      }

      if (!bestNext) {
        hero.innerHTML = `
          <div class="hero-next">
            <div>
              <div class="hero-kicker">Tiếp theo</div>
              <div class="hero-title">Đang chờ thợ phù hợp</div>
              <div class="hero-sub">Khách sẽ được phục vụ khi có thợ phù hợp hoặc khi khách đồng ý chuyển thợ.</div>
            </div>
            <div class="hero-stats">
              <span class="pill">${waiting} waiting</span>
              <span class="pill success">${available} available</span>
              <span class="pill">${serving} serving</span>
            </div>
          </div>
        `;
        const signature = "blocked:" + waiting + ":" + available + ":" + serving;
        if (lastHeroSignature !== signature) {
          lastHeroSignature = signature;
          showToast("Đang chờ thợ phù hợp.");
        }
        return;
      }

      const signature = `${bestNext.client.id}:${bestNext.tech.id}`;
      hero.innerHTML = `
        <div class="hero-next">
          <div>
            <div class="hero-kicker">Tiếp theo</div>
            <div class="hero-title">${escapeHtml(bestNext.client.name)} → ${escapeHtml(bestNext.tech.name)}</div>
            <div class="hero-sub">${escapeHtml(bestNext.client.service)} • ${escapeHtml(shortLabelText(bestNext.client, state))} • ${turnValue(bestNext.client, state)}T • ${escapeHtml(bestNext.reason)}</div>
          </div>
          <div class="hero-stats">
            <span class="pill">${waiting} waiting</span>
            <span class="pill success">${available} available</span>
            <span class="pill">${serving} serving</span>
          </div>
        </div>
      `;

      if (lastHeroSignature !== signature) {
        lastHeroSignature = signature;
        showToast(`Tiếp theo: ${bestNext.client.name} → ${bestNext.tech.name}`);
        speakCall(signature, `${bestNext.client.name}, please come to ${bestNext.tech.name}`);
      }
    }

    function renderWaitingList(state) {
      const queue = [...state.queue].sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
      const bestNext = getBestNextCustomer(state);
      if (!queue.length) {
        return `
          <div class="section-card" style="padding:14px 16px;">
            <div class="empty-queue-compact">✨ Không có khách đang chờ — Lumi available phục vụ khách tiếp theo.</div>
          </div>
        `;
      }

      return `
        <div class="section-card">
          <div class="section-head">
            <div>
              <div class="section-title">Khách đang đợi</div>
              <div class="section-sub">Khách vào trước ở trên, khách vào sau ở dưới để mọi người dễ theo dõi.</div>
            </div>
            <span class="pill">${queue.length} khách</span>
          </div>
          ${bestNext ? `
            <div style="margin-bottom:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
              <span class="next-badge">Tiếp theo</span>
              <span><strong>${escapeHtml(bestNext.client.name || "")}</strong> • ${escapeHtml(bestNext.client.service || "")} • ${escapeHtml(shortLabelText(bestNext.client, state))} • ${escapeHtml(bestNext.reason || "")}: ${escapeHtml(bestNext.tech?.name || "")}</span>
            </div>
          ` : ""}
          <div class="wait-table-wrap">
            <table class="wait-table">
              <thead>
                <tr>
                  <th style="width:70px;">#</th>
                  <th style="width:220px;">Tên khách</th>
                  <th>Dịch vụ cần làm</th>
                  <th style="width:240px;">Loại khách</th>
                  <th style="width:120px;">Số turn</th>
                  <th style="width:120px;">Wait time</th>
                  <th style="width:220px;">Gợi ý kế</th>
                </tr>
              </thead>
              <tbody>
                ${queue.map((item, index) => {
                  const requestedTech = item.requestedTechId ? state.technicians.find(t => String(t.id) === String(item.requestedTechId)) : null;
                  const isRequested = item.requestType === "requested";
                  const isNext = bestNext && bestNext.client && String(bestNext.client.id) === String(item.id);
                  const requestInfo = labelStack(item, state, true);
                  const rowExtra = priorityTagOf(item) ? ` priority-${priorityTagOf(item)}` : "";
                  const nextInfo = suggestionForQueueItem(item, state, bestNext);
                  return `
                    <tr class="${isRequested ? "requested-row" : ""} ${isNext ? "next-customer-row" : ""}${rowExtra}">
                      <td><span class="queue-index">${index + 1}</span></td>
                      <td><strong>${escapeHtml(item.name || "")}</strong></td>
                      <td>${escapeHtml(item.service || "")}</td>
                      <td>${requestInfo}</td>
                      <td><span class="turn-pill">${turnValue(item, state)}T</span></td>
                      <td><span class="turn-pill" style="background:rgba(111,127,154,.10);color:#5e6e88;">${waitTimeText(item)}</span></td>
                      <td>${nextInfo}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderBoard() {
      document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      const stateRaw = readState();
      const normalized = normalizeState(stateRaw);
      const container = document.getElementById("content");

      if (!normalized || !normalized.technicians.length) {
        document.getElementById("heroNext").innerHTML = "";
        container.innerHTML = `
          <div class="empty-state">
            <strong>Chưa đọc được dữ liệu từ Lumi system.</strong><br>
            Hãy mở file này trên cùng domain/origin với Front Desk PRO.
          </div>
        `;
        setStatus("");
        return;
      }

      const bestNext = getBestNextCustomer(normalized);
      renderHero(normalized);

      const staff = [...normalized.technicians].sort((a, b) => {
        const aRank = a.active && a.status === "ready" ? 0 : a.status === "busy" ? 1 : 2;
        const bRank = b.active && b.status === "ready" ? 0 : b.status === "busy" ? 1 : 2;
        if (aRank !== bRank) return aRank - bRank;

        const aTurn = Number(a.turnsTotal || 0);
        const bTurn = Number(b.turnsTotal || 0);
        if (aTurn !== bTurn) return aTurn - bTurn;

        const ai = a.checkInOrder == null ? Number.MAX_SAFE_INTEGER : a.checkInOrder;
        const bi = b.checkInOrder == null ? Number.MAX_SAFE_INTEGER : b.checkInOrder;
        if (ai !== bi) return ai - bi;

        return String(a.name).localeCompare(String(b.name));
      });

      const historySlots = 10;
      const nextSlots = 3;

      let html = `
        <div class="board">
          <table>
            <thead>
              <tr>
                <th class="col-index">#</th>
                <th class="col-name">Nhân viên</th>
                <th class="col-turn">Turn</th>
                <th class="col-time">Time</th>
                ${Array.from({length: historySlots}, (_, i) => `<th class="slot-col">Slot ${i+1}</th>`).join("")}
                ${Array.from({length: nextSlots}, (_, i) => `<th class="slot-col">Next ${i+1}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
      `;

      staff.forEach((tech, idx) => {
        const tiles = tilesForTech(tech, normalized, historySlots);
        const next = nextCandidateForTech(tech, normalized);
        const nextTiles = [];
        if (next) {
          nextTiles.push({
            service: shortService(next),
            requested: next.requestType === "requested",
            turn: turnValue(next, normalized),
            serving: false,
            combo: /comb|combo/i.test(next.service || ""),
            regular: /reg|regular/i.test(next.service || ""),
            green: /combo|vip|brow|wax/i.test(next.service || ""),
            red: false
          });
        }

        const duration = getTechDuration(tech, normalized.serving, normalized.history);
        const statusInfo = techStatusLabel(tech);

        html += `
          <tr class="${techRowClass(tech)} ${bestNext && bestNext.tech && String(bestNext.tech.id) === String(tech.id) ? "highlight-tech tech-next-priority" : ""}">
            <td class="col-index">${idx + 1}</td>
            <td class="staff-cell col-name">
              <div class="staff-name">${escapeHtml(tech.name)}</div>
              <div class="staff-sub">
                <span class="turn-box">[${tech.turnsTotal}]</span>
                <span class="time-chip ${duration.status}">${escapeHtml(duration.label)}</span>
                <span class="tech-status ${statusInfo.cls}">${statusInfo.text}</span>
              </div>
            </td>
            <td class="col-turn staff-cell"><strong>${tech.turnsTotal}</strong></td>
            <td class="col-time staff-cell"><span class="time-chip ${duration.status}">${escapeHtml(duration.label)}</span></td>
        `;

        for (let i = 0; i < historySlots; i++) {
          const tile = tiles[i];
          html += `<td class="slot">${tile ? renderTicket(tile) : renderEmpty(i >= tiles.length - 1 ? tech.name : "")}</td>`;
        }

        for (let i = 0; i < nextSlots; i++) {
          const tile = nextTiles[i];
          html += `<td class="slot">${tile ? renderTicket(tile) : renderEmpty(i === nextSlots - 1 ? tech.name : "")}</td>`;
        }

        html += `</tr>`;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html + renderWaitingList(normalized);

      const parts = [
        `Đang đồng bộ`,
        `<strong>${normalized.technicians.length}</strong> thợ`,
        `<strong>${normalized.queue.length}</strong> khách chờ`,
        `<strong>${normalized.serving.length}</strong> đang phục vụ`
      ];
      if (bestNext) {
        parts.push(`Tiếp theo: <strong>${escapeHtml(bestNext.client.name || "")}</strong> → ${escapeHtml(bestNext.tech?.name || "")}`);
      }
      setStatus(`<div class="status-box">${parts.join(" • ")}</div>`);
    }

    function safeRender() {
      try {
        renderBoard();
      } catch (err) {
        document.getElementById("content").innerHTML = `<div class="error-box">Không render được view.\n\n${escapeHtml(String(err && err.stack || err))}</div>`;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => safeRender());
    document.getElementById("legendBtn").addEventListener("click", () => {
      document.getElementById("legendWrap").classList.toggle("show");
    });

    window.addEventListener("storage", (event) => {
      if (!event.key || event.key === STORAGE_KEY) safeRender();
    });

    safeRender();
    setInterval(() => safeRender(), 1500);
  
    const nextHeroToggleBtn = document.getElementById("nextHeroToggleBtn");
    if(nextHeroToggleBtn){
      nextHeroToggleBtn.addEventListener("click", () => setNextHeroVisible(!showNextHero));
      updateNextHeroToggleUI();
    }
    setTimeout(applyNextHeroVisibility, 0);
    setInterval(applyNextHeroVisibility, 300);


  
    // Keep Next Hero visibility consistent even after live re-render.
    const nextHeroObserver = new MutationObserver(() => applyNextHeroVisibility());
    nextHeroObserver.observe(document.body, { childList:true, subtree:true });

  </script>
</body>
</html>
